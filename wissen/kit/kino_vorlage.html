<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <script type="importmap">{"imports":{"three":"./assets/three/build/three.module.js","three/addons/":"./assets/three/jsm/"}}</script>
    <style>
      @font-face { font-family: "Inter Display"; font-weight: 900; src: url("assets/fonts/InterDisplay-Black.otf"); }
      @font-face { font-family: "Inter Display"; font-weight: 800; src: url("assets/fonts/InterDisplay-ExtraBold.otf"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-SemiBold.otf"); }
      html, body { background: #000; }
      #root { font-family: "Inter Display", "Inter", sans-serif; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .tag { top: 140px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 8px; color: rgba(255,255,255,0.78); text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
      .bar { position: absolute; left: 90px; right: 90px; top: 200px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); }
      .bar i { display: block; width: 0; height: 100%; border-radius: 3px; background: #ffd23f; box-shadow: 0 0 14px rgba(255,210,63,0.7); }
      .lbl { top: 330px; font-size: 62px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 4px 24px rgba(0,0,0,0.9); }
      .lbl small { display: block; font-family: "Inter", sans-serif; font-weight: 600; font-size: 36px; color: rgba(255,255,255,0.82); margin-top: 10px; letter-spacing: 0; }
      .lbl .big { display: block; font-size: 120px; font-weight: 900; color: #ffd23f; text-shadow: 0 0 40px rgba(255,210,63,0.5), 0 4px 24px rgba(0,0,0,0.9); white-space: nowrap; }
      .lbl .red { color: #ff4d5e; text-shadow: 0 0 40px rgba(255,77,94,0.5), 0 4px 24px rgba(0,0,0,0.9); }
      .lbl .blue { color: #7fd0ff; text-shadow: 0 0 40px rgba(127,208,255,0.5), 0 4px 24px rgba(0,0,0,0.9); }
      .capw { top: 1400px; font-size: 92px; font-weight: 900; line-height: 1.12; letter-spacing: -1px; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,0.85), 0 0 3px #000; }
      .capw .w { display: inline-block; margin: 0 10px; padding: 0 4px 6px; }
      .capw .on { background: #ffd23f; color: #111; padding: 0 20px 6px; border-radius: 18px; transform: rotate(-2deg) scale(1.06); text-shadow: none; box-shadow: 0 10px 40px rgba(255,210,63,0.45); }
      .hookbig { top: 560px; font-size: 136px; }
      .hookbig .y { color: #ffd23f; text-shadow: 0 0 46px rgba(255,210,63,0.8); }
      .hookdim { background: radial-gradient(circle at 50% 42%, rgba(0,0,10,0.15), rgba(0,0,6,0.7)); }
      .share { position: absolute; right: 40px; top: 1050px; }
      .share span { display: inline-block; background: #fe2c55; color: #fff; font-weight: 900; font-size: 54px; padding: 16px 34px; border-radius: 60px; box-shadow: 0 0 40px rgba(254,44,85,0.7); }
      .follow { top: 1080px; }
      {{CSS}}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <canvas id="stage" data-layout-allow-overflow width="1080" height="1920"></canvas>
      <div id="tag" class="line tag clip" data-start="0" data-duration="{{DUR}}" data-track-index="1"><span>{{TAG}}</span></div>
      <div id="bar" class="bar clip" data-start="0" data-duration="{{DUR}}" data-track-index="2"><i id="bar-in"></i></div>
      <div id="lbl" class="line lbl clip" data-start="0" data-duration="{{DUR}}" data-track-index="3"><span id="lbl-in"></span></div>
      <div id="cap" class="line capw clip" data-start="{{HOOK_END}}" data-duration="{{CAP_DUR}}" data-track-index="4"><span id="cap-in"></span></div>
      <div id="hookdim" class="hookdim clip" data-start="0" data-duration="{{HOOK_END}}" data-track-index="8"><span id="hookdim-in"></span></div>
      <div id="hookbig" class="line hookbig clip" data-start="0" data-duration="{{HOOK_END}}" data-track-index="7"><span id="hookbig-in">{{HOOK}}</span></div>
      <div id="share" class="share clip" data-start="{{SHARE_START}}" data-duration="{{SHARE_DUR}}" data-track-index="5"><span id="share-in">{{SHARE_TEXT}}</span></div>
      <div id="follow" class="line follow clip" data-start="{{FOLLOW}}" data-duration="{{FOLLOW_DUR}}" data-track-index="6"><span id="follow-in" class="box"><span class="t">Folg uns für mehr! 👆</span><span class="pill">+ Folgen</span></span></div>
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{VOICE_DUR}}" data-track-index="9" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="{{DUR}}" data-track-index="10" data-volume="0.3"></audio>
    </div>
    <img id="tex-day" src="assets/earth-blue-marble.jpg" style="display:none" alt="" />
    <img id="tex-night" src="assets/earth-night.jpg" style="display:none" alt="" />
    <img id="tex-topo" src="assets/earth-topology.png" style="display:none" alt="" />
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#hookbig-in", { opacity: 0, scale: 1.35, duration: 0.35, ease: "power3.out" }, 0);
      tl.to("#hookbig-in", { scale: 0.6, opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, {{HOOK_END}} - 0.32);
      tl.to("#hookdim", { opacity: 0, duration: 0.3 }, {{HOOK_END}} - 0.32);
      tl.from("#share-in", { opacity: 0, x: 80, scale: 0.6, duration: 0.3, ease: "back.out(2.5)" }, {{SHARE_START}});
      tl.to("#share-in", { x: 18, duration: 0.25, yoyo: true, repeat: 7, ease: "sine.inOut" }, {{SHARE_START}} + 0.4);
      tl.to("#share-in", { opacity: 0, duration: 0.2 }, {{SHARE_START}} + {{SHARE_DUR}} - 0.25);
      tl.from("#follow-in", { opacity: 0, scale: 0.6, duration: 0.3, ease: "back.out(2.5)" }, {{FOLLOW}});
      tl.to("#follow-in .pill", { scale: 1.1, duration: 0.3, yoyo: true, repeat: 3 }, {{FOLLOW}} + 0.4);
      tl.to("#bar-in", { width: "100%", duration: {{DUR}}, ease: "none" }, 0);
      tl.to({}, { duration: 0.01 }, {{DUR}} - 0.01);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as K from "./assets/kino.js";
      const { THREE, V, lerp, eio, eout, prog, cl, rnd, de } = K;
      const WORDS = {{WORDS}};
      const CHUNKS = {{CHUNKS}};
      const cap = K.captions(WORDS, CHUNKS, document.getElementById("cap-in"), {{HOOK_END}}, {{FIX}});
      const label = K.labeler(document.getElementById("lbl-in"));
      const img = (id) => document.getElementById(id);
      const imgsReady = Promise.all(["tex-day", "tex-night", "tex-topo"].map((id) => { const im = img(id); return im.complete ? Promise.resolve(im) : new Promise((r) => (im.onload = () => r(im))); }));
      const E = K.setup(document.getElementById("stage"));
      const cam = E.cam;
      let renderAt = () => {};
      const ready = imgsReady.then(async ([day, night, topo]) => {
{{SCENE}}
        renderAt(lastT);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.scene = ready;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
    </script>
  </body>
</html>
