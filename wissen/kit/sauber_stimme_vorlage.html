<!doctype html>
<html lang="de" data-resolution="{{RES}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <script type="importmap">{"imports":{"three":"./assets/three/build/three.module.js","three/addons/":"./assets/three/jsm/"}}</script>
    <style>
      @font-face { font-family: "Inter Display"; font-weight: 900; src: url("assets/fonts/InterDisplay-Black.otf"); }
      @font-face { font-family: "Inter Display"; font-weight: 800; src: url("assets/fonts/InterDisplay-ExtraBold.otf"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-SemiBold.otf"); }
      html, body { background: #000; }
      #root { font-family: "Inter Display", "Inter", sans-serif; background: #000; }
      #stage { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; }
      .tag { top: 140px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: 8px; color: rgba(255,255,255,0.6); }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .pl { position: absolute; transform: translate(-50%, -100%); font: 800 76px "Inter Display", sans-serif; color: #fff; white-space: nowrap; text-shadow: 0 4px 30px rgba(0,0,0,.9); letter-spacing: 0.5px; }
      .pl small { display: block; text-align: center; font: 600 34px "Inter", sans-serif; color: rgba(255,255,255,.7); margin-top: 4px; }
      #word { position: absolute; left: 0; right: 0; top: 1420px; text-align: center; font: 800 132px "Inter Display", sans-serif; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.9); }
      .hookbig { top: 620px; font-size: 128px; font-weight: 900; line-height: 1.04; text-shadow: 0 8px 50px rgba(0,0,0,.95); }
      .hookbig .y { color: #ffd23f; }
      .hookdim { background: radial-gradient(circle at 50% 40%, rgba(0,0,0,.2), rgba(0,0,0,.75)); }
      .capw { top: 1500px; font-size: 80px; font-weight: 800; line-height: 1.12; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.95), 0 0 3px #000; }
      .capw .w { display: inline-block; margin: 0 10px; }
      .capw .on { color: #ffd23f; }
      .share { position: absolute; right: 40px; top: 1150px; }
      .share span { display: inline-block; background: #fe2c55; color: #fff; font-weight: 900; font-size: 50px; padding: 14px 32px; border-radius: 60px; box-shadow: 0 0 34px rgba(254,44,85,.6); }
      .follow { top: 1150px; }
      {{CSS}}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <canvas id="stage" data-layout-allow-overflow width="{{W}}" height="{{H}}"></canvas>
      <div id="labels" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="2"></div>
      <div id="word" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="3"></div>
      <div id="tag" class="line tag clip" data-start="0" data-duration="{{DUR}}" data-track-index="1"><span>{{TAG}}</span></div>
      <div id="cap" class="line capw clip" data-start="{{HOOK_END}}" data-duration="{{CAP_DUR}}" data-track-index="4"><span id="cap-in"></span></div>
      <div id="hookdim" class="hookdim clip" data-start="0" data-duration="{{HOOK_END}}" data-track-index="8"><span></span></div>
      <div id="hookbig" class="line hookbig clip" data-start="0" data-duration="{{HOOK_END}}" data-track-index="7"><span id="hookbig-in">{{HOOK}}</span></div>
      <div id="share" class="share clip" data-start="{{SHARE_START}}" data-duration="{{SHARE_DUR}}" data-track-index="5"><span id="share-in">{{SHARE_TEXT}}</span></div>
      <div id="follow" class="line follow clip" data-start="{{FOLLOW}}" data-duration="{{FOLLOW_DUR}}" data-track-index="6"><span id="follow-in" class="box"><span class="t">{{FOLLOW_TEXT}}</span><span class="pill">{{FOLLOW_PILL}}</span></span></div>
      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{VOICE_DUR}}" data-track-index="9" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="{{DUR}}" data-track-index="10" data-volume="0.3"></audio>
    </div>
    <img id="tex-day" src="assets/earth-blue-marble.jpg" style="display:none" alt="" />
    <img id="tex-night" src="assets/earth-night.jpg" style="display:none" alt="" />
    <img id="tex-topo" src="assets/earth-topology.png" style="display:none" alt="" />
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#hookbig-in", { opacity: 0, scale: 1.3, duration: 0.35, ease: "power3.out" }, 0);
      tl.to("#hookbig-in", { scale: 0.7, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, {{HOOK_END}} - 0.32);
      tl.to("#hookdim", { opacity: 0, duration: 0.3 }, {{HOOK_END}} - 0.32);
      tl.from("#share-in", { opacity: 0, x: 80, scale: 0.6, duration: 0.3, ease: "back.out(2.5)" }, {{SHARE_START}});
      tl.to("#share-in", { scale: 1.08, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, {{SHARE_START}} + 0.4);
      tl.to("#share-in", { opacity: 0, duration: 0.2 }, {{SHARE_START}} + {{SHARE_DUR}} - 0.25);
      tl.from("#follow-in", { opacity: 0, scale: 0.6, duration: 0.3, ease: "back.out(2.5)" }, {{FOLLOW}});
      tl.to("#follow-in .pill", { scale: 1.1, duration: 0.3, yoyo: true, repeat: 3 }, {{FOLLOW}} + 0.4);
      tl.to({}, { duration: 0.01 }, {{DUR}} - 0.01);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as K from "./assets/kino.js";
      const { THREE, V, lerp, eio, eout, prog, cl, rnd } = K;
      window.FMT = { W: {{W}}, H: {{H}} };
      const WORDS = {{WORDS}}; const CHUNKS = {{CHUNKS}};
      const cap = K.captions(WORDS, CHUNKS, document.getElementById("cap-in"), {{HOOK_END}}, {{FIX}});
      const img = (id) => document.getElementById(id);
      const imgsReady = Promise.all(["tex-day", "tex-night", "tex-topo"].map((id) => { const im = img(id); return im.complete ? Promise.resolve(im) : new Promise((r) => (im.onload = () => r(im))); }));
      const E = K.setup(document.getElementById("stage"));
      const cam = E.cam;
      const TL = new THREE.TextureLoader();
      const tex = async (f) => { const t = await TL.loadAsync("assets/tex/" + f); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
      // Beschriftungen, die an 3D-Objekten hängen
      const LB = document.getElementById("labels"), WORD = document.getElementById("word");
      const labels = [];
      const label = (html, obj, r, o = {}) => { const d = document.createElement("div"); d.className = "pl"; d.innerHTML = html; LB.appendChild(d); const L = { d, obj, r, t0: o.t0 ?? 0, t1: o.t1 ?? 999, gap: o.gap ?? 40, size: o.size }; if (o.size) d.style.fontSize = o.size + "px"; labels.push(L); return L; };
      const P = (v) => { const q = v.clone().project(cam); return [(q.x + 1) / 2 * {{W}}, (1 - q.y) / 2 * {{H}}]; };
      const updLabels = (t) => { cam.updateMatrixWorld(true); labels.forEach((L) => { const p = L.obj.getWorldPosition(new THREE.Vector3()); const top = p.clone().add(cam.up.clone().multiplyScalar(L.r)); const [x] = P(p), [, y] = P(top);
        const a = cl((t - L.t0) / 0.4) * (1 - cl((t - L.t1) / 0.4)); L.d.style.opacity = a; L.d.style.left = x + "px"; L.d.style.top = y - L.gap + "px"; L.d.style.transform = `translate(-50%,-100%) translateY(${(1 - a) * 20}px)`; }); };
      let lastWord = ""; const word = (h, a) => { if (h !== lastWord) { WORD.innerHTML = h; lastWord = h; } WORD.style.opacity = a; WORD.style.transform = `translateY(${(1 - a) * 30}px)`; };
      let renderAt = () => {};
      const ready = imgsReady.then(async ([day, night, topo]) => {
{{SCENE}}
        renderAt(lastT);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.scene = ready;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
    </script>
  </body>
</html>
