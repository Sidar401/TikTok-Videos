<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"ID";font-weight:900;src:url("InterDisplay-Black.otf")}
html,body{margin:0;background:#000}
#root{position:relative;overflow:hidden}
canvas{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;text-align:center;color:#fff;font-family:"ID","Inter Display",sans-serif;font-weight:900}
</style></head><body>
<div id="root"><canvas id="c"></canvas><canvas id="o"></canvas></div>
<script type="module">
import * as THREE from "./three.module.js";
await document.fonts.load('900 100px ID');
const q=new URLSearchParams(location.search),W=+q.get("w"),H=+q.get("h"),MODE=q.get("m");
const root=document.getElementById("root");root.style.width=W+"px";root.style.height=H+"px";
const cv=document.getElementById("c");
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setSize(W,H,false);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;
const sc=new THREE.Scene();const cam=new THREE.PerspectiveCamera(MODE==="pb"?30:22,W/H,.1,3000);
let s=5;const rnd=()=>((s=s*16807%2147483647)/2147483647);
// Sterne + Nebel
const P=[],C=[];for(let i=0;i<6000;i++){const u=rnd()*2-1,a=rnd()*6.283,r=800;P.push(Math.sqrt(1-u*u)*Math.cos(a)*r,u*r,Math.sqrt(1-u*u)*Math.sin(a)*r-0);const w=rnd();C.push(...(w<.6?[1,1,1]:w<.85?[.75,.85,1]:[1,.85,.7]))}
const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.Float32BufferAttribute(P,3));sg.setAttribute("color",new THREE.Float32BufferAttribute(C,3));
sc.add(new THREE.Points(sg,new THREE.PointsMaterial({size:MODE==="pb"?2.2:2.6,vertexColors:true,transparent:true,opacity:.9})));
const L=new THREE.TextureLoader();const ld=u=>new Promise(r=>L.load(u,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;r(t)}));
const [day,night]=await Promise.all([ld("earth-blue-marble.jpg"),ld("earth-night.jpg")]);
const sun=new THREE.Vector3(.35,.75,-.55).normalize();
const em=new THREE.ShaderMaterial({uniforms:{d:{value:day},n:{value:night},sun:{value:sun}},
vertexShader:`varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vV=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform sampler2D d,n;uniform vec3 sun;varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){float l=dot(vN,sun);float k=smoothstep(-.12,.2,l);vec3 dc=texture2D(d,vUv).rgb*(.1+1.3*max(l,0.));vec3 nc=texture2D(n,vUv).rgb*vec3(1.4,1.05,.65)*1.9;vec3 c=mix(nc,dc,k);float f=pow(1.-clamp(dot(vN,vV),0.,1.),2.5);c+=vec3(.3,.6,1.)*f*(.15+1.4*smoothstep(-.3,.4,l));gl_FragColor=vec4(c,1.);}`});
const RE=10;const earth=new THREE.Mesh(new THREE.SphereGeometry(RE,192,192),em);earth.rotation.set(.5,-2.2,.1);sc.add(earth);
const atm=new THREE.Mesh(new THREE.SphereGeometry(RE*1.06,128,128),new THREE.ShaderMaterial({transparent:true,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false,uniforms:{sun:{value:sun}},
vertexShader:`varying vec3 vN;varying vec3 vW;void main(){vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform vec3 sun;varying vec3 vN;varying vec3 vW;void main(){vec3 v=normalize(cameraPosition-vW);float i=pow(max(.62-dot(vN,v),0.),3.);float l=smoothstep(-.5,.6,dot(vN,sun));gl_FragColor=vec4(vec3(.35,.65,1.)*i*(.2+2.2*l),1.);}`}));sc.add(atm);
if(MODE==="pb"){cam.position.set(0,6,30);cam.lookAt(0,13.5,0);}
else{cam.position.set(0,4,58);cam.lookAt(0,13.2,0);}
R.render(sc,cam);
// Overlay: Nova-Blitz + Schrift
const o=document.getElementById("o");o.width=W;o.height=H;const g=o.getContext("2d");
function nova(x,y,sz){g.save();g.globalCompositeOperation="lighter";
 let gr=g.createRadialGradient(x,y,0,x,y,sz*1.6);gr.addColorStop(0,"rgba(255,250,235,1)");gr.addColorStop(.06,"rgba(255,235,190,.95)");gr.addColorStop(.2,"rgba(255,180,90,.35)");gr.addColorStop(.5,"rgba(120,140,255,.12)");gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(x-sz*2,y-sz*2,sz*4,sz*4);
 const ray=(ang,len,wd,a)=>{g.save();g.translate(x,y);g.rotate(ang);const lg=g.createLinearGradient(-len,0,len,0);lg.addColorStop(0,"rgba(255,230,200,0)");lg.addColorStop(.5,`rgba(255,250,240,${a})`);lg.addColorStop(1,"rgba(255,230,200,0)");g.fillStyle=lg;g.beginPath();g.ellipse(0,0,len,wd,0,0,7);g.fill();g.restore()};
 ray(0,sz*3.2,sz*.035,1);ray(Math.PI/2,sz*(MODE==="pb"?2.2:1.1),sz*.03,.9);ray(Math.PI/4,sz*1.1,sz*.02,.5);ray(-Math.PI/4,sz*1.1,sz*.02,.5);
 g.restore()}
// Stern-Funkeln "aufgehend" am Erdrand
const v=new THREE.Vector3(0,RE*1.02,0).applyAxisAngle(new THREE.Vector3(0,0,1),MODE==="pb"?-.18:-.12).project(cam);
const nx=(v.x+1)/2*W,ny=(1-v.y)/2*H;
if(MODE==="pb"){
 nova(W*.5,H*.3,W*.2);
 g.font=`900 ${W*.5}px ID`;g.textAlign="center";g.textBaseline="middle";
 const tg=g.createLinearGradient(0,H*.3,0,H*.75);tg.addColorStop(0,"#ffffff");tg.addColorStop(1,"#ffd98a");
 g.shadowColor="rgba(255,190,90,.75)";g.shadowBlur=W*.06;g.fillStyle=tg;g.fillText("N",W*.5,H*.5);
 g.shadowBlur=0;g.lineWidth=W*.006;g.strokeStyle="rgba(255,255,255,.5)";g.strokeText("N",W*.5,H*.5);
}else{
 nova(nx,ny,H*.13);
 g.textAlign="center";g.textBaseline="alphabetic";
 g.font=`900 ${H*.17}px ID`;
 const tg=g.createLinearGradient(0,H*.3,0,H*.5);tg.addColorStop(0,"#ffffff");tg.addColorStop(1,"#ffd98a");
 g.shadowColor="rgba(255,190,90,.6)";g.shadowBlur=H*.03;g.fillStyle=tg;
 g.letterSpacing=`${H*.012}px`;g.fillText("NOVARO",W/2,H*.47);
 g.shadowBlur=0;g.letterSpacing="0px";g.font=`600 ${H*.034}px Inter`;g.fillStyle="rgba(255,255,255,.85)";
 g.fillText("Was wäre, wenn …?  ·  Weltall  ·  Erde  ·  Unglaubliche Fakten",W/2,H*.545);
}
window.ready=true;
</script></body></html>
