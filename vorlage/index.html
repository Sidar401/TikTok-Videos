<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Kanal-Stil (siehe STIL.md) */
      @font-face {
        font-family: "Abril Fatface";
        src: url("assets/fonts/abril-fatface.woff2") format("woff2");
      }
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --brand: #F28C28; /* Kanalfarbe aus kanal.json */
        --green: #1f7a4d;
        --gold: #f2c418;
        --red: #e24b4b;
        --blue: #3d7be0;
        --font-caption: "Montserrat", sans-serif;
        --font-display: "Abril Fatface", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg);
      }

      /* Szene: eine Illustration, zentriert im oberen Bereich */
      .scene {
        position: absolute;
        left: 0;
        top: 230px;
        width: 1080px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .art { width: 820px; height: 820px; }
      .art svg { width: 100%; height: 100%; display: block; }

      /* Untertitel-Box (TikTok-Look) */
      .cap {
        position: absolute;
        left: 0;
        top: 1360px;
        width: 1080px;
        display: flex;
        justify-content: center;
      }
      .cap span {
        display: block;
        max-width: 880px;
        padding: 20px 44px 22px;
        border-radius: 28px;
        background: var(--brand);
        color: #ffffff;
        font-family: var(--font-caption);
        font-weight: 600;
        font-size: 54px;
        line-height: 1.15;
        text-align: center;
      }

      /* Zahlen-Vergleich in Serifen-Schrift */
      .cmp {
        width: 940px;
        display: grid;
        grid-template-columns: 1fr 6px 1fr;
        column-gap: 40px;
        font-family: var(--font-display);
        color: var(--ink);
        text-align: center;
      }
      .cmp .head { font-size: 104px; line-height: 1.1; }
      .cmp .sub { font-size: 76px; line-height: 1.1; }
      .cmp .divider { background: var(--ink); grid-row: 1 / span 3; grid-column: 2; }
      .cmp .arrow { height: 260px; display: flex; justify-content: center; align-items: center; }
      .cmp .arrow svg { width: 140px; height: 220px; }
      .cmp .num { font-size: 96px; line-height: 1.2; }
      .green { color: var(--green); }
      .gold { color: var(--gold); }
      .chart-label { font-family: var(--font-display); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- ============ SZENEN ============ -->

      <!-- 1: Geldsack -->
      <div id="s1" class="scene clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="s1-art" class="art">
          <svg viewBox="0 0 400 400">
            <g id="s1-coins">
              <g fill="#f2c418" stroke="#c99a06" stroke-width="3">
                <rect x="250" y="300" width="110" height="22" rx="8" />
                <rect x="250" y="276" width="110" height="22" rx="8" />
                <rect x="250" y="252" width="110" height="22" rx="8" />
                <rect x="250" y="228" width="110" height="22" rx="8" />
                <rect x="250" y="204" width="110" height="22" rx="8" />
                <rect x="265" y="180" width="110" height="22" rx="8" />
                <rect x="258" y="156" width="110" height="22" rx="8" />
              </g>
            </g>
            <g id="s1-bag">
              <path d="M150 110 C120 70 140 50 160 70 C175 50 205 50 220 70 C240 50 260 70 230 110 Z" fill="#1f7a4d" />
              <rect x="145" y="104" width="90" height="18" rx="9" fill="#f2c418" />
              <path d="M150 120 C60 170 40 330 120 340 L260 340 C340 330 320 170 230 120 Z" fill="#1f7a4d" />
              <path d="M155 135 C90 180 75 300 125 325" fill="none" stroke="#2c9a63" stroke-width="10" stroke-linecap="round" />
              <circle cx="190" cy="245" r="62" fill="#f2c418" />
              <text x="190" y="272" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="80" fill="#1f7a4d">€</text>
            </g>
            <g fill="#f2c418" stroke="#c99a06" stroke-width="3">
              <ellipse cx="80" cy="345" rx="34" ry="12" />
              <ellipse cx="110" cy="360" rx="34" ry="12" />
            </g>
          </svg>
        </div>
      </div>

      <!-- 2: Zielscheibe -->
      <div id="s2" class="scene clip" data-start="3" data-duration="3" data-track-index="1">
        <div id="s2-art" class="art">
          <svg viewBox="0 0 400 400">
            <circle cx="190" cy="210" r="160" fill="#e24b4b" />
            <circle cx="190" cy="210" r="125" fill="#f6efe1" />
            <circle cx="190" cy="210" r="92" fill="#e24b4b" />
            <circle cx="190" cy="210" r="58" fill="#f6efe1" />
            <circle cx="190" cy="210" r="26" fill="#e24b4b" />
            <g id="s2-arrow">
              <line x1="196" y1="204" x2="340" y2="60" stroke="#555" stroke-width="10" stroke-linecap="round" />
              <path d="M320 50 L370 30 L350 80 L340 60 Z" fill="#e8742c" />
              <path d="M335 35 L375 15 L365 45 Z" fill="#e8742c" />
            </g>
          </svg>
        </div>
      </div>

      <!-- 3: Zahlen-Vergleich -->
      <div id="s3" class="scene clip" data-start="6" data-duration="3.5" data-track-index="1">
        <div class="cmp">
          <div id="s3-h1" style="grid-column:1"><div class="head">Konto</div><div class="sub">0 %</div></div>
          <div class="divider"></div>
          <div id="s3-h2" style="grid-column:3"><div class="head">ETF</div><div class="sub">~7 %</div></div>
          <div class="arrow" style="grid-column:1">
            <svg viewBox="0 0 70 110"><path id="s3-a1" d="M40 6 C10 30 8 70 40 98" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" /><path d="M24 92 L42 100 L44 80" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </div>
          <div class="arrow" style="grid-column:3">
            <svg viewBox="0 0 70 110"><path id="s3-a2" d="M30 6 C60 30 62 70 30 98" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" /><path d="M46 92 L28 100 L26 80" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </div>
          <div id="s3-n1" class="num green" style="grid-column:1">36.000€</div>
          <div style="grid-column:3">
            <div id="s3-n2" class="num green">36.000€</div>
            <div id="s3-n3" class="num gold">77.000€</div>
          </div>
        </div>
      </div>

      <!-- 4: Rendite-Chart -->
      <div id="s4" class="scene clip" data-start="9.5" data-duration="3" data-track-index="1">
        <div class="art">
          <svg viewBox="0 0 400 400">
            <path d="M40 40 L40 340 L370 340" fill="none" stroke="#111" stroke-width="8" stroke-linecap="square" />
            <path id="s4-solid" d="M60 300 C140 285 220 280 290 255" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" />
            <path id="s4-dots" d="M60 285 C150 250 230 190 300 95" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16" />
            <text id="s4-label" class="chart-label" x="70" y="100" font-size="70" fill="#1f7a4d">~7%</text>
            <g id="s4-check">
              <circle cx="320" cy="80" r="42" fill="#111" />
              <path d="M300 82 L315 97 L342 66" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
            </g>
          </svg>
        </div>
      </div>

      <!-- 5: Outro -->
      <div id="s5" class="scene clip" data-start="12.5" data-duration="2.5" data-track-index="1">
        <div id="s5-art" class="art">
          <svg viewBox="0 0 400 400">
            <circle cx="200" cy="200" r="150" fill="#F28C28" />
            <path d="M120 260 L180 200 L220 235 L290 150" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M250 145 L295 145 L295 190" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <!-- ============ UNTERTITEL ============ -->
      <div id="captions" data-track-kind="captions">
        <div id="c1" class="cap clip" data-start="0" data-duration="1.6" data-track-index="2"><span>du hast 100 € im Monat übrig</span></div>
        <div id="c2" class="cap clip" data-start="1.6" data-duration="1.4" data-track-index="2"><span>und fragst dich, was du damit machst</span></div>
        <div id="c3" class="cap clip" data-start="3" data-duration="3" data-track-index="2"><span>die Frage aller Fragen</span></div>
        <div id="c4" class="cap clip" data-start="6" data-duration="1.7" data-track-index="2"><span>100 € im Monat, 30 Jahre lang</span></div>
        <div id="c5" class="cap clip" data-start="7.7" data-duration="1.8" data-track-index="2"><span>auf dem Konto bleiben es 36.000 €</span></div>
        <div id="c6" class="cap clip" data-start="9.5" data-duration="3" data-track-index="2"><span>im ETF kommen ~77.000 € Rendite dazu</span></div>
        <div id="c7" class="cap clip" data-start="12.5" data-duration="2.5" data-track-index="2"><span>folg mir für mehr Geld-Tipps</span></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at) =>
        tl.fromTo(sel, { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, at);
      const drift = (sel, at, dur) =>
        tl.fromTo(sel, { scale: 1 }, { scale: 1.05, duration: dur, ease: "sine.inOut" }, at);
      const draw = (sel, at, dur) => {
        const len = document.querySelector(sel).getTotalLength();
        tl.fromTo(sel, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      };

      // 1: Geldsack
      pop("#s1-art", 0);
      drift("#s1-bag", 0.35, 2.5);
      tl.fromTo("#s1-coins", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.25);

      // 2: Zielscheibe, Pfeil schlägt ein
      pop("#s2-art", 3);
      tl.fromTo("#s2-arrow", { x: 160, y: -160, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.3, ease: "power4.in" }, 3.3);
      tl.fromTo("#s2-art", { rotation: 0 }, { rotation: 2, duration: 0.06, yoyo: true, repeat: 3, ease: "none" }, 3.6);

      // 3: Zahlen-Vergleich
      pop("#s3-h1", 6);
      pop("#s3-h2", 6.15);
      tl.fromTo(["#s3-a1", "#s3-a2"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.5);
      pop("#s3-n1", 7.7);
      pop("#s3-n2", 7.85);
      pop("#s3-n3", 9.0);

      // 4: Chart zeichnet sich
      draw("#s4-solid", 9.6, 0.7);
      tl.fromTo("#s4-dots", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 10.1);
      pop("#s4-label", 10.6);
      pop("#s4-check", 10.9);

      // 5: Outro
      pop("#s5-art", 12.5);
      drift("#s5-art", 12.85, 2.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
