      const OUT = (f) => { const a = LOOP(4.0), c = V(-12, 3, 10), b = V(-30, 8, 30); return a.clone().multiplyScalar((1 - f) * (1 - f)).add(c.clone().multiplyScalar(2 * f * (1 - f))).add(b.clone().multiplyScalar(f * f)); };

      const PN = [0, 2.72, 5.52, 8.72, 11.12, 14.08, 16.4, 20.12, 21.36, 24.16, 30], PO = [0, 2.71, 5.66, 9.01, 11.56, 14.59, 17.14, 21.13, 22.56, 25.59, 30];
      const toOld = (t) => { for (let k = 0; k < PN.length - 1; k++) if (t <= PN[k + 1]) return PO[k] + (t - PN[k]) * (PO[k + 1] - PO[k]) / (PN[k + 1] - PN[k]); return t; };
      function renderAt(tReal) {
        const t = toOld(tReal);
        if (!U.d.value) return;
        seed = 99;
        earth.rotation.y = -1.6 + t * 0.04;
        moon.position.copy(MOON); moon.rotation.y = t * 0.02;
        rock.scale.setScalar(0.16); rock.rotation.set(t * 0.7, t * 0.5, t * 0.3); rock.visible = true;
        mark.material.opacity = 0; ring.material.opacity = 0; path.material.opacity = 0; trailMat.opacity = 0;
        flashEl.style.opacity = 0;
        let lbl = "";
        const loopA = (t) => 0.2 + (t - 11.5) * 0.55;
        if (t < 5.6) {
          // Erde + großer Mond, dann leuchtet ein zweiter Punkt auf
          const f = eio(prog(t, 0, 5.6));
          setCam(V(lerp(2, 0, f), lerp(3.5, 2.6, f), lerp(22, 19, f)), V(-1.2, 0.3, -1));
          rock.position.copy(LOOP(1.2 + t * 0.12));
          mark.position.copy(rock.position); mark.scale.setScalar(1.4 + 0.25 * Math.sin(t * 6)); mark.material.opacity = prog(t, 1.4, 0.4);
          ring.position.copy(rock.position); ring.lookAt(cam.position); ring.scale.setScalar(0.9 + 0.1 * Math.sin(t * 5)); ring.material.opacity = prog(t, 1.6, 0.4);
          lbl = t > 2.6 ? `Mond Nr. 2 entdeckt!<small>klein, aber echt</small>` : "";
        } else if (t < 8.95) {
          // Nahaufnahme: winzig wie eine Waschmaschine
          const f = prog(t, 5.6, 3.35);
          rock.position.set(0, 0.4, 0); rock.scale.setScalar(0.95);
          earthG.position.set(0, -6.2, -6); atm.position.copy(earthG.position);
          setCam(V(0, 0.8, lerp(8.5, 7, eio(f))), V(0, 0.4, 0));
          lbl = t > 6.1 ? `<span class="big">1–2 Meter</span><small>so groß wie eine Waschmaschine</small>` : "";
        } else if (t < 11.5) {
          // April: eingefangen
          const f = eio(prog(t, 8.95, 2.55));
          rock.position.copy(IN(f));
          setTrail((q) => IN(Math.max(0, q)), f, 0.5); trailMat.opacity = 0.9;
          mark.position.copy(rock.position); mark.scale.setScalar(2.4); mark.material.opacity = 0.9;
          setCam(V(4, 6, 24), V(2, 0.5, -3));
          lbl = `April 2026<small>die Erde fängt ihn ein</small>`;
        } else if (t < 14.5) {
          // Wilde Schleifen
          const a = loopA(t);
          rock.position.copy(LOOP(a)); setTrail(LOOP, a, 2.2); trailMat.opacity = 1;
          path.material.opacity = 0.35 * prog(t, 11.6, 0.6);
          mark.position.copy(rock.position); mark.scale.setScalar(1.2); mark.material.opacity = 0.8;
          setCam(V(Math.sin(t * 0.2) * 3, 14, 15), V(0, -0.5, 0));
          lbl = `Wilde Schleifen<small>einmal rund um die Erde – und wieder</small>`;
        } else if (t < 17.1) {
          // Entdeckt erst im August: Fadenkreuz
          const a = loopA(t); rock.position.copy(LOOP(a)); setTrail(LOOP, a, 2.2); trailMat.opacity = 0.8; path.material.opacity = 0.25;
          const f = eio(prog(t, 14.5, 1.2));
          const look = rock.position.clone(); const out = look.clone().setY(0).normalize();
          setCam(look.clone().add(out.multiplyScalar(6 * lerp(3, 1, f))).add(V(0, 1.5, 0)), look);
          rock.scale.setScalar(0.3);
          ring.position.copy(rock.position); ring.lookAt(cam.position); ring.scale.setScalar(lerp(3, 0.55, eout(prog(t, 14.8, 0.8)))); ring.material.opacity = prog(t, 14.8, 0.3);
          flashEl.style.opacity = t > 15.6 && t < 15.9 ? 0.25 * (1 - (t - 15.6) / 0.3) : 0;
          lbl = t > 15.0 ? `Entdeckt erst im August<small>monatelang hat ihn niemand bemerkt</small>` : "";
        } else if (t < 21.1) {
          // Sein Name
          const a = loopA(t); rock.position.copy(LOOP(a)); setTrail(LOOP, a, 2.2); trailMat.opacity = 0.8; path.material.opacity = 0.25;
          const look = rock.position.clone(); rock.scale.setScalar(0.3); const out = look.clone().setY(0).normalize();
          setCam(look.clone().add(out.multiplyScalar(6)).add(V(Math.sin(t * 0.5) * 1.2, 1.5, 0)), look);
          ring.position.copy(rock.position); ring.lookAt(cam.position); ring.scale.setScalar(0.55); ring.material.opacity = 0.9;
          lbl = t > 17.9 ? `<span class="big">2026 QQ8</span><small>sein offizieller Name</small>` : "";
        } else if (t < 25.5) {
          // Tschüss: fliegt davon
          const f = eio(prog(t, 22.4, 3.0));
          if (t < 22.4) { const a = loopA(t); rock.position.copy(LOOP(a)); setTrail(LOOP, a, 2.2); }
          else { rock.position.copy(OUT(f)); setTrail((q) => (q < 0 ? LOOP(4.0 + q * 3) : OUT(q)), f, 0.6); }
          trailMat.opacity = 0.9; path.material.opacity = 0.25 * (1 - f);
          mark.position.copy(rock.position); mark.scale.setScalar(1.2); mark.material.opacity = 0.8;
          setCam(V(-3, 8, 22), V(-3, 0.5, 2));
          lbl = t > 22.4 ? `Ende 2026: Tschüss! 👋<small>er fliegt zurück ins All</small>` : `Lange bleibt er nicht …`;
        } else {
          // Schluss: Erde + Mond
          const f = eio(prog(t, 25.5, 4.5));
          setCam(V(lerp(1, -1, f), 2.8, lerp(19, 21, f)), V(-0.8, 0.6, -1));
          rock.visible = false;
          lbl = t < 27.3 ? `Welchen Namen gibst du ihm? 👇` : "";
        }
        dl.position.copy(sunDir).multiplyScalar(10);
        camLight.target.position.copy(rock.position); camLight.position.copy(cam.position).add(V(-2, 3, 0));
        mark.visible = mark.material.opacity > 0.01; ring.visible = ring.material.opacity > 0.01; path.visible = path.material.opacity > 0.01; trail.visible = trailMat.opacity > 0.01;
        if (t >= 8.95 || t < 5.6) { earthG.position.set(0, 0, 0); atm.position.set(0, 0, 0); }
        R.render(sc, cam);
        captions(tReal); label(lbl);
      }

      const ready = Promise.all(["tex-day", "tex-night"].map((id) => { const im = document.getElementById(id); return im.complete ? Promise.resolve(im) : new Promise((r) => (im.onload = () => r(im))); })).then(([a, b]) => {
        const mk = (im) => { const tx = new THREE.Texture(im); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; tx.needsUpdate = true; return tx; };
        U.d.value = mk(a); U.n.value = mk(b); renderAt(lastT);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.scene = ready;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
    </script>
  </body>
</html>
