<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:220px;width:1080px;font-weight:900;font-size:120px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Musk plant den</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">Mega-Deal</span></div></div><div style="position:absolute;left:290px;top:560px;width:500px;height:620px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 8px #DB8622, 0 0 80px #ff8a1f88, 0 40px 60px #000;z-index:2"><img src="assets/elon-musk.jpg" style="width:100%;height:100%;object-fit:cover;object-position:50% 20%"/></div><div style="position:absolute;left:80px;top:1150px;width:190px;padding:22px;border-radius:26px;background:#fff;box-shadow:0 0 50px #ffffff55, 0 30px 40px #000;transform:rotate(-6deg);z-index:3"><img src="assets/tesla-symbol.png" style="width:100%;display:block"/></div><div style="position:absolute;left:600px;top:1200px;width:400px;padding:22px;border-radius:26px;background:#fff;box-shadow:0 0 50px #ffffff55, 0 30px 40px #000;transform:rotate(5deg);z-index:3"><img src="assets/spacex.png" style="width:100%;display:block"/></div><div style="position:absolute;left:230px;top:1460px;padding:8px 30px 12px;border-radius:20px;background:#2fd27a;color:#111;font-weight:900;font-size:84px;white-space:nowrap;box-shadow:0 0 40px #2fd27a99;transform:rotate(-2deg);z-index:3">= 3,5 Billionen $</div><div style="position:absolute;left:250px;top:1640px;padding:8px 30px 12px;border-radius:20px;background:#ff8a1f;color:#111;font-weight:900;font-size:60px;white-space:nowrap;box-shadow:0 0 40px #ff8a1f99;transform:rotate(2deg);z-index:3">Größter Deal ever?</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
