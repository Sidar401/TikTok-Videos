<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 55%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:220px;width:1080px;font-weight:900;font-size:140px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Karte oder</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">Bargeld?</span></div></div><div style="position:absolute;left:90px;top:860px;width:440px;height:280px;border-radius:30px;background:linear-gradient(135deg,#4d8ff0,#2a5cb8);box-shadow:0 0 60px #4d8ff088, 0 30px 50px #000c;transform:rotate(-8deg);z-index:2;padding:36px"><div style="width:90px;height:66px;border-radius:12px;background:linear-gradient(135deg,#fff2b0,#ffc533 60%,#b87800)"></div></div><div style="position:absolute;left:570px;top:880px;width:420px;height:220px;border-radius:20px;background:linear-gradient(135deg,#9fdc8c,#4d9a43);border:4px solid #2f5a28;box-shadow:0 0 40px #2fd27a55;transform:rotate(6deg);z-index:2"></div><div style="position:absolute;left:580px;top:858px;width:420px;height:220px;border-radius:20px;background:linear-gradient(135deg,#9fdc8c,#4d9a43);border:4px solid #2f5a28;box-shadow:0 0 40px #2fd27a55;transform:rotate(6deg);z-index:2"></div><div style="position:absolute;left:590px;top:836px;width:420px;height:220px;border-radius:20px;background:linear-gradient(135deg,#9fdc8c,#4d9a43);border:4px solid #2f5a28;box-shadow:0 0 40px #2fd27a55;transform:rotate(6deg);z-index:2"></div><div style="position:absolute;left:600px;top:814px;width:420px;height:220px;border-radius:20px;background:linear-gradient(135deg,#9fdc8c,#4d9a43);border:4px solid #2f5a28;box-shadow:0 0 40px #2fd27a55;transform:rotate(6deg);z-index:2"></div><div style="position:absolute;left:465px;top:1180px;width:150px;height:150px;border-radius:50%;background:#ff8a1f;color:#111;font-weight:900;font-size:66px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px #0e1012, 0 0 60px #ff8a1f;z-index:4">VS</div><div style="position:absolute;left:0;top:1440px;width:1080px;text-align:center;font-weight:900;font-size:70px;line-height:1.15;color:#fff">Womit gibst du<br/><span style="color:#ff8a1f">mehr aus?</span></div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
