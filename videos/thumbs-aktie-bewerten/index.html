<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:200px;width:1080px;font-weight:900;font-size:110px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Welche Aktie</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">ist billiger?</span></div></div><div style="position:absolute;left:120px;top:640px;transform:rotate(-7deg);z-index:3"><div style="position:relative;padding:30px 60px 30px 110px;border-radius:30px 90px 90px 30px;background:#ff4d4d;color:#111;font-weight:900;font-size:150px;box-shadow:0 0 80px #ff4d4daa, 0 30px 50px #000"><span style="position:absolute;left:34px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#111"></span>5 €</div><div style="margin-top:18px;text-align:center;font-weight:900;font-size:64px;color:#ff4d4d;text-shadow:0 0 30px #ff4d4d">TEURER!</div></div><div style="position:absolute;left:300px;top:1010px;transform:rotate(5deg);z-index:3"><div style="position:relative;padding:30px 60px 30px 110px;border-radius:30px 90px 90px 30px;background:#2fd27a;color:#111;font-weight:900;font-size:150px;box-shadow:0 0 80px #2fd27aaa, 0 30px 50px #000"><span style="position:absolute;left:34px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#111"></span>500 €</div><div style="margin-top:18px;text-align:center;font-weight:900;font-size:64px;color:#2fd27a;text-shadow:0 0 30px #2fd27a">BILLIGER!</div></div><div style="position:absolute;left:230px;top:1500px;padding:8px 30px 12px;border-radius:20px;background:#ff8a1f;color:#111;font-weight:900;font-size:76px;white-space:nowrap;box-shadow:0 0 40px #ff8a1f99;transform:rotate(-2deg);z-index:3">4 Profi-Checks ✓</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
