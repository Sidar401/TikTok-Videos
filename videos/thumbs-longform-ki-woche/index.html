<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:220px;width:1080px;font-weight:900;font-size:124px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Die Woche</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff4d4d;color:#fff;box-shadow:0 0 60px #ff4d4d88">der Wahrheit</span></div></div><div style="position:absolute;left:50px;top:640px;width:300px;height:360px;border-radius:30px;background:#14181b;border:8px solid #ff4d4d;box-shadow:0 0 70px #ff4d4d88, 0 30px 40px #000;transform:rotate(-5deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:3"><div style="font-weight:900;font-size:120px;color:#ff4d4d">MO</div><div style="font-size:110px">📉</div></div><div style="position:absolute;left:390px;top:610px;width:300px;height:360px;border-radius:30px;background:#14181b;border:8px solid #76b900;box-shadow:0 0 70px #76b90088, 0 30px 40px #000;transform:rotate(0deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:3"><div style="font-weight:900;font-size:120px;color:#76b900">DI</div><div style="background:#fff;border-radius:14px;padding:12px"><img src="assets/nvidia.svg" style="width:220px;display:block"/></div></div><div style="position:absolute;left:730px;top:640px;width:300px;height:360px;border-radius:30px;background:#14181b;border:8px solid #d97757;box-shadow:0 0 70px #d9775788, 0 30px 40px #000;transform:rotate(5deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:3"><div style="font-weight:900;font-size:120px;color:#d97757">DO</div><div style="background:#fff;border-radius:14px;padding:16px"><img src="assets/anthropic.svg" style="width:220px;display:block"/></div></div><div style="position:absolute;left:130px;top:1200px;padding:8px 30px 12px;border-radius:20px;background:#ff8a1f;color:#111;font-weight:900;font-size:80px;white-space:nowrap;box-shadow:0 0 40px #ff8a1f99;transform:rotate(-3deg);z-index:3">Boom oder Blase?</div><div style="position:absolute;left:300px;top:1420px;padding:8px 30px 12px;border-radius:20px;background:#2ecc71;color:#fff;font-weight:900;font-size:66px;white-space:nowrap;box-shadow:0 0 40px #2ecc7199;transform:rotate(2deg);z-index:3">für deinen ETF</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
