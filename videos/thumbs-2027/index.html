<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:170px;width:1080px;font-weight:900;font-size:104px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Das ändert sich</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">für DEIN Geld</span></div></div><div style="position:absolute;left:330px;top:640px;width:399px;height:446px;border-radius:34px;background:#f4f1ea;overflow:hidden;box-shadow:0 0 120px #ff8a1f88;transform:rotate(4deg);z-index:2"><div style="height:114px;background:#ff8a1f;color:#111;font-weight:900;font-size:66px;text-align:center;line-height:114px">JAN</div><div style="text-align:center;font-weight:900;font-size:142px;color:#111;line-height:332px">2027</div></div><div style="position:absolute;left:120px;top:1240px;padding:6px 34px;border:10px solid #2fd27a;border-radius:20px;color:#2fd27a;font-weight:900;font-size:88px;transform:rotate(-5deg);background:#0e1012ee;box-shadow:0 0 50px #2fd27a88;z-index:3">GEWINNER</div><div style="position:absolute;left:380px;top:1420px;padding:6px 34px;border:10px solid #ff4d4d;border-radius:20px;color:#ff4d4d;font-weight:900;font-size:84px;transform:rotate(4deg);background:#0e1012ee;box-shadow:0 0 50px #ff4d4d88;z-index:3">VERLIERER</div><div style="position:absolute;left:0;top:1640px;width:1080px;text-align:center;font-weight:900;font-size:62px;color:#fff">…bist du dabei?</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
