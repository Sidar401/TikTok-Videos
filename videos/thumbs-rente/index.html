<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 60% 60%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:200px;width:1080px;font-weight:900;font-size:118px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Wie viel Rente</div><div style="color:#fff;text-shadow:0 6px 0 #000">bekommst DU</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">wirklich?</span></div></div><div style="position:absolute;left:160px;top:880px;width:300px;height:680px;border-radius:24px;background:linear-gradient(180deg,#2fd27a,#2fd27a99);box-shadow:0 0 50px #2fd27a88;z-index:2;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 0"><span style="font-weight:900;font-size:62px;color:#111">2.500 €</span><span style="font-weight:800;font-size:44px;color:#111c">heute</span></div><div style="position:absolute;left:640px;top:1180px;width:300px;height:380px;border-radius:24px;background:linear-gradient(180deg,#9aa3a8,#9aa3a899);box-shadow:0 0 50px #9aa3a888;z-index:2;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 0"><span style="font-weight:900;font-size:62px;color:#111">1.400 €</span><span style="font-weight:800;font-size:44px;color:#111c">Rente</span></div><div style="position:absolute;left:640px;top:880px;width:300px;height:280px;border-radius:24px;border:7px dashed #ff8a1f;box-shadow:0 0 40px #ff8a1f66;display:flex;align-items:center;justify-content:center;z-index:2;font-weight:900;font-size:56px;white-space:nowrap;color:#ff8a1f;text-shadow:0 0 30px #ff8a1faa">−1.100 €</div><div style="position:absolute;left:0;top:1640px;width:1080px;text-align:center;font-weight:900;font-size:72px;color:#ff8a1f;text-shadow:0 0 40px #ff8a1f88">Die Rentenlücke</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
