<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      .cap { top: 1460px; }
      .big { top: 1420px; font-size: 58px; }
      .big small { font-size: 36px; }
      #cta { top: 1440px; font-size: 56px; line-height: 1.2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <canvas id="stage" data-layout-allow-overflow width="1080" height="1920"></canvas>
      <div id="title" class="line title clip" data-start="0" data-duration="30" data-track-index="1"><span>1 Bakterie –<br /><span class="g">alle 20 Minuten doppelt</span></span></div>
      <div id="info" class="line info clip" data-start="0" data-duration="30" data-track-index="2"><span id="info-in"></span></div>

      <div id="c0" class="line cap clip" data-start="0.5" data-duration="2.3" data-track-index="3"><span id="c0-in">Was passiert in <span class="y">2 Tagen?</span></span></div>
      <div id="c1" class="line cap clip" data-start="2.8" data-duration="6.2" data-track-index="3"><span id="c1-in">2 … 4 … 8 … 16 … 32 …</span></div>
      <div id="b1" class="line big clip" data-start="10.5" data-duration="3.5" data-track-index="3"><span id="b1-in"><span class="y glow-y">10 Stunden: 1 Milliarde</span></span></div>
      <div id="b2" class="line big clip" data-start="15.5" data-duration="2.2" data-track-index="3"><span id="b2-in"><span class="o glow-y">1 Tag: 4.700 Tonnen</span><small>so schwer wie fast 1.000 Elefanten</small></span></div>
      <div id="b3" class="line big clip" data-start="19.5" data-duration="3.5" data-track-index="3"><span id="b3-in"><span class="r glow-r">44 Std.: schwerer als die ERDE!</span></span></div>
      <div id="c2" class="line cap clip" data-start="23.0" data-duration="4.5" data-track-index="3"><span id="c2-in">Zum Glück gehen <span class="g">Futter & Platz</span> aus.<small>trotzdem: Hände waschen! 🧼</small></span></div>
      <div id="cta" class="line clip" data-start="27.5" data-duration="2.5" data-track-index="3"><span id="cta-in">Hättest <span class="y">DU</span> das gedacht?<br /><span class="g">JA</span> oder <span class="r">NEIN</span>?</span></div>

      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="30" data-track-index="6" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const T = K.texts(tl);
      T.pop("c0-in", 0.5, 2.3); T.pop("c1-in", 2.8, 6.2); T.slam("b1-in", 10.5, 3.5); T.slam("b2-in", 15.5, 2.2); T.slam("b3-in", 19.5, 3.5); T.pop("c2-in", 23.0, 4.5);
      T.pop("cta-in", 27.5); T.pulse("cta-in", 28.0, 3);
      tl.to({}, { duration: 0.01 }, 29.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      const g = K.init("stage");
      const { cl, lerp, eio, eout, prog, de, C, rnd } = K;
      const info = document.getElementById("info-in");
      function bact(x, y, s, rot, col = C.mint) {
        g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.globalAlpha *= 0.9; g.shadowColor = col; g.shadowBlur = 12 * s;
        g.beginPath(); g.roundRect(-30 * s, -12 * s, 60 * s, 24 * s, 12 * s); g.fill(); g.shadowBlur = 0;
        g.strokeStyle = "rgba(255,255,255,0.5)"; g.lineWidth = 2; g.beginPath(); g.moveTo(-20 * s, 0); g.lineTo(20 * s, 0); g.stroke(); g.restore();
      }
      function SUP(n) { return String(n).split("").map((d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+d]).join(""); }

      function renderAt(t) {
        g.setTransform(1, 0, 0, 1, 0, 0);
        K.bg(t, { stars: 0.1, top: "#0f1f24", mid: "#0a1418" });
        const sh = K.shake(t, [[19.5, 18]]);
        g.setTransform(1, 0, 0, 1, sh, sh * 0.6);
        // Petrischale
        K.ring(540, 1000, 400, "rgba(200,240,255,0.7)", 6, 1);
        let ih = "";
        let gen = 0, hours = 0;
        if (t < 9.0) {
          gen = Math.max(0, Math.min(7, Math.floor((t - 2.8) / 0.85) + 1));
          const n = Math.pow(2, gen), split = t > 2.8 ? cl(((t - 2.8) % 0.85) / 0.3) : 1;
          const s = Math.max(0.5, 2.2 / Math.sqrt(Math.max(1, n) / 2));
          for (let i = 0; i < n; i++) { const a = rnd(i) * 6.28, r = Math.sqrt(rnd(i + 3)) * Math.min(330, 40 * Math.sqrt(n)); bact(540 + Math.cos(a) * r, 1000 + Math.sin(a) * r, s * (i >= n / 2 ? split : 1), a); }
          hours = gen / 3;
          ih = "Anzahl: <b>" + de(n) + "</b>";
        } else {
          const KF = [[9.0, 8], [10.5, 30], [15.5, 72], [17.5, 72], [19.5, 132], [30, 132]];
          for (let k = 0; k < KF.length - 1; k++) if (t < KF[k + 1][0]) { gen = Math.round(lerp(KF[k][1], KF[k + 1][1], eio((t - KF[k][0]) / (KF[k + 1][0] - KF[k][0])))); break; }
          // Schale füllt sich
          for (let i = 0; i < 700; i++) { const a = rnd(i) * 6.28, r = Math.sqrt(rnd(i + 3)) * 380; bact(540 + Math.cos(a) * r, 1000 + Math.sin(a) * r, 0.5, a, ["#5ef2c2", "#8fe9ff", "#b4f5c8"][i % 3]); }
          if (t > 19.5) { const f = eout(prog(t, 19.5, 0.8)); K.earth(540, 1000, 120 * f); }
          hours = gen / 3;
          const ex = Math.floor(gen * 0.30103);
          ih = "Anzahl: <b>ca. 10" + SUP(ex) + "</b>";
        }
        const hh = Math.floor(hours), mm = Math.round((hours - hh) * 60);
        K.mono(hh + " h " + String(mm).padStart(2, "0") + " min", 540, 520, 64, "#ffffff", C.mint);
        g.setTransform(1, 0, 0, 1, 0, 0);
        K.flash(t, [[19.5, 0.4]]);
        if (info.innerHTML !== ih) info.innerHTML = ih;
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
