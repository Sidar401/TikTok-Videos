<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:220px;width:1080px;font-weight:900;font-size:112px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Inflation sinkt –</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">aber Vorsicht!</span></div></div><div style="position:absolute;left:0;width:1080px;top:540px;text-align:center;font-weight:900;font-size:260px;color:#ff8a1f;text-shadow:0 0 70px #ff8a1f;z-index:2">2,8 %</div><div style="position:absolute;left:200px;top:900px;width:680px;padding:34px;border-radius:34px;background:#0b0d0f;border:10px solid #ff4d4d;box-shadow:0 0 90px #ff4d4d88, 0 30px 50px #000;text-align:center;transform:rotate(-3deg);z-index:3"><div style="font-size:90px">⛽</div><div style="font-family:monospace;font-weight:900;font-size:130px;white-space:nowrap;color:#ff4d4d;text-shadow:0 0 40px #ff4d4d;line-height:1">+16,7 ct</div><div style="font-family:monospace;font-size:44px;color:#ccc">ab Januar?</div></div><div style="position:absolute;left:200px;top:1560px;padding:8px 30px 12px;border-radius:20px;background:#ffd34d;color:#fff;font-weight:900;font-size:72px;white-space:nowrap;box-shadow:0 0 40px #ffd34d99;transform:rotate(-2deg);z-index:3">Der Trick dahinter</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
