<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 55%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:200px;width:1080px;font-weight:900;font-size:102px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Wie lange musst</div><div style="color:#fff;text-shadow:0 6px 0 #000">du dafür</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">ARBEITEN?</span></div></div><div style="position:absolute;left:90px;top:760px;padding:8px 30px 12px;border-radius:20px;background:#ff4d4d;color:#fff;font-weight:900;font-size:62px;white-space:nowrap;box-shadow:0 0 40px #ff4d4d99;transform:rotate(-6deg);z-index:3">Handy: 1.000 €</div><div style="position:absolute;left:290px;top:820px;width:500px;height:500px;border-radius:50%;background:#16191b;border:12px solid #ff8a1f;box-shadow:0 0 90px #ff8a1f77, 0 40px 60px #000;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-weight:900;font-size:170px;line-height:1;color:#fff;text-shadow:0 0 40px #ff8a1faa">80</div><div style="font-weight:800;font-size:64px;color:#ff8a1f">Stunden</div></div><div style="position:absolute;left:0;top:1420px;width:1080px;text-align:center;font-weight:900;font-size:76px;color:#fff">= 2 volle <span style="color:#ff8a1f">Wochen</span></div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
