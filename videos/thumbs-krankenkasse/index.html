<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 50%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:230px;width:1080px;font-weight:900;font-size:140px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Zahlst du</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">ZU VIEL?</span></div></div><div style="position:absolute;left:170px;top:700px;width:740px;height:460px;border-radius:40px;background:linear-gradient(135deg,#4d8ff0,#2a5bb8);box-shadow:0 0 100px #4d8ff088;transform:rotate(-5deg);z-index:2"><div style="position:absolute;left:55px;top:55px;width:130px;height:96px;border-radius:16px;background:#ffc533"></div><div style="position:absolute;left:55px;top:210px;font-weight:900;font-size:60px;color:#fff">Krankenkasse</div><div style="position:absolute;left:55px;top:320px;width:420px;height:24px;border-radius:12px;background:#ffffff55"></div></div><div style="position:absolute;left:0;top:1260px;width:1080px;text-align:center;font-weight:900;font-size:190px;color:#2fd27a;text-shadow:0 0 60px #2fd27aaa;z-index:3">≈ 130 €</div><div style="position:absolute;left:0;top:1500px;width:1080px;text-align:center;font-weight:900;font-size:64px;color:#fff">pro Jahr sparen</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
