<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 50%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:170px;width:1080px;font-weight:900;font-size:110px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Nvidia-Chef</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">Jensen Huang</span></div></div><div style="position:absolute;left:290px;top:490px;width:500px;height:120px;border-radius:26px;background:#fff;padding:20px 44px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px #76b90088;z-index:3"><img src="assets/nvidia.svg" style="max-width:100%;max-height:100%"/></div><div style="position:absolute;left:240px;top:620px;width:600px;height:600px;border-radius:50%;overflow:hidden;border:14px solid #76b900;box-shadow:0 0 120px #76b90088;z-index:2"><img src="assets/jensen-huang.jpg" style="width:100%;height:100%;object-fit:cover;object-position:50% 15%"/></div><div style="position:absolute;left:0;top:1600px;width:1080px;text-align:center;font-family:monospace;font-size:24px;color:#ffffff88;z-index:3">Foto: Peter Dasilva · CC BY 4.0</div><div style="position:absolute;left:300px;top:1000px;padding:10px 50px;border:14px solid #ff4d4d;border-radius:22px;color:#ff4d4d;font-weight:900;font-size:170px;letter-spacing:6px;transform:rotate(-10deg);background:#0e1012dd;box-shadow:0 0 60px #ff4d4d88;z-index:4">RAUS!</div><div style="position:absolute;left:170px;top:1330px;padding:8px 30px 12px;border-radius:20px;background:#ff8a1f;color:#111;font-weight:900;font-size:50px;white-space:nowrap;box-shadow:0 0 40px #ff8a1f99;transform:rotate(-3deg);z-index:3">Was heißt das für deinen ETF?</div><div style="position:absolute;left:340px;top:1460px;padding:8px 30px 12px;border-radius:20px;background:#ff4d4d;color:#fff;font-weight:900;font-size:64px;white-space:nowrap;box-shadow:0 0 40px #ff4d4d99;transform:rotate(3deg);z-index:3">Aktie −13 %</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
