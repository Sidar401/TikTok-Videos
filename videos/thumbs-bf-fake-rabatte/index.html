<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:220px;width:1080px;font-weight:900;font-size:120px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Black Friday</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff4d4d;color:#fff;box-shadow:0 0 60px #ff4d4d88">Fake-Rabatte</span></div></div><div style="position:absolute;left:170px;top:640px;width:740px;padding:40px;border-radius:34px;background:#14181b;border:8px solid #ff4d4d;box-shadow:0 0 90px #ff4d4d88, 0 40px 60px #000;text-align:center;transform:rotate(-3deg);z-index:2"><div style="font-family:monospace;font-size:90px;color:#9aa0a6;text-decoration:line-through;text-decoration-color:#ff4d4d;text-decoration-thickness:10px">450 €</div><div style="font-weight:900;font-size:210px;color:#fff;line-height:1;text-shadow:0 0 50px #ff4d4d">299 €</div></div><div style="position:absolute;left:760px;top:520px;font-size:200px;transform:rotate(12deg);z-index:3">🛍️</div><div style="position:absolute;left:250px;top:1130px;padding:14px 50px;border:12px solid #ff4d4d;border-radius:22px;color:#ff4d4d;font-weight:900;font-size:150px;letter-spacing:8px;transform:rotate(-10deg);text-shadow:0 0 40px #ff4d4d;box-shadow:0 0 40px #ff4d4d88;z-index:4">FAKE?</div><div style="position:absolute;left:250px;top:1520px;padding:8px 30px 12px;border-radius:20px;background:#2fd27a;color:#111;font-weight:900;font-size:74px;white-space:nowrap;box-shadow:0 0 40px #2fd27a99;transform:rotate(-2deg);z-index:3">3 Tricks erkennen</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
