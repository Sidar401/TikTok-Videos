          pg.attributes.position.needsUpdate = true;
          lbl = t > 10.6 ? `Alles rast nach Osten<small>mit über 1.600 km/h</small>` : "";
        } else if (t < 16.5) {
          // Sturm
          earthG.rotation.z = 0.2;
          setCam(V(-3, 1.2, 10.5).add(shake(t, 13.6, 0.03)).add(V(Math.sin(t * 40) * 0.01, 0, 0)), V(0, -0.3, 0));
          storm.material.opacity = 0.9 * prog(t, 13.5, 0.5); storm.rotation.y = -(t - 13.5) * 2.2;
          R.toneMappingExposure = 0.9;
          lbl = t > 13.9 ? `Ein Mega-Sturm<small>stärker als jeder Hurrikan</small>` : "";
        } else if (t < 21.32) {
          // Meere zu den Polen, Kontinent am Äquator
          earthG.rotation.z = 0.2;
          storm.material.opacity = 0.9 * (1 - prog(t, 16.5, 0.6)); storm.rotation.y = -3 * 2.2 - (t - 16.5) * 0.5;
          const f = eio(prog(t, 16.6, 3.2));
          U.shift.value = f;
          setCam(V(lerp(-3, 0, f), lerp(1.2, 3.5, f), lerp(10.5, 11.5, f)), V(0, -0.3, 0));
          lbl = t < 18.3 ? `Die Meere wandern<small>zu Nord- und Südpol</small>` : `Ein Super-Kontinent<small>einmal rund um den Äquator</small>`;
        } else if (t < 24.68) {
          // 1 Tag = 1 Jahr: Sonne wandert langsam
          U.shift.value = 1; earthG.rotation.z = 0.2;
          const f = prog(t, 21.32, 3.36);
          const a = lerp(-1.2, 1.4, eio(f));
          sunDir.set(Math.sin(a), 0.1, Math.cos(a)).normalize();
          setCam(V(0, 0.6, 12.5), V(0, -0.3, 0));
          sun.position.copy(sunDir).multiplyScalar(60).add(V(0, -0.3, 0)); sun.material.opacity = 0.9; sun.scale.set(14, 14, 1);
          lbl = `<span class="big">1 Tag = 1 Jahr</span><small>die Sonne wandert ganz langsam</small>`;
        } else if (t < 26.04) {
          // 6 Monate Sonne
          U.shift.value = 1; U.heat.value = prog(t, 24.68, 1); earthG.rotation.z = 0.2;
          sunDir.set(0.15, 0.2, 1).normalize();
          setCam(V(0, 0.3, lerp(11, 9.5, prog(t, 24.68, 1.4))), V(0, -0.3, 0));
          sun.position.set(6, 9, -20); sun.material.opacity = 0.9; sun.scale.set(16, 16, 1);
          R.toneMappingExposure = 1.15;
          lbl = `☀ 6 Monate Sonne`;
        } else {
          // 6 Monate Dunkelheit + Schluss
          U.shift.value = 1; earthG.rotation.z = 0.2;
          sunDir.set(0.1, 0.2, -1).normalize();
          setCam(V(0, 0.3, lerp(9.5, 12, prog(t, 26.04, 3.5))), V(0, -0.3, 0));
          lbl = t < 27.6 ? `🌑 6 Monate Nacht` : "";
        }
        atm.position.copy(earthG.position);
        dl.position.copy(sunDir).multiplyScalar(10);
        storm.visible = storm.material.opacity > 0.01; eqRing.visible = eqRing.material.opacity > 0.01; parts.visible = pmat.opacity > 0.01; sun.visible = sun.material.opacity > 0.01;
        R.render(sc, cam);
        captions(t); label(lbl);
      }

      const ready = Promise.all(["tex-day", "tex-night"].map((id) => { const im = document.getElementById(id); return im.complete ? Promise.resolve(im) : new Promise((r) => (im.onload = () => r(im))); })).then(([a, b]) => {
        const mk = (im) => { const tx = new THREE.Texture(im); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; tx.needsUpdate = true; return tx; };
        U.d.value = mk(a); U.n.value = mk(b); renderAt(lastT);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.scene = ready;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
    </script>
  </body>
