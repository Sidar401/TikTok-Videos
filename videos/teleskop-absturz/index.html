          const p0 = V(-2.6, 4.4, 4.5), p1 = V(2.2, -2.6, 4.5);
          const head = p0.clone().lerp(p1, f);
          sat.position.copy(head); sat.rotation.set(t * 3, t * 2, t); sat.scale.setScalar(0.07);
          trail.forEach((s, i) => { const k = i / trail.length; const p = p0.clone().lerp(p1, Math.max(0, f - k * 0.25)); s.position.copy(p); s.scale.setScalar(0.7 * (1 - k) + 0.08); s.material.opacity = (1 - k) * 0.95; });
        } else if (t < 6.27) {
          // Swift auf der Umlaufbahn, 22 Jahre
          const f = eio(prog(t, 2.85, 3.4));
          setCam(V(lerp(2, -1, f), lerp(2.2, 1.6, f), lerp(10, 9.5, f)), V(0, -0.2, 0), 1.45);
          orbitLine.scale.setScalar(ORB); orbitLine.rotation.set(Math.PI / 2 - INC, 0, 0); orbitLine.material.opacity = 0.6 * prog(t, 2.9, 0.4);
          const ang = 0.6 + t * 0.35; sat.position.copy(orbitPos(ang, ORB)); sat.lookAt(0, 0, 0); sat.scale.setScalar(0.17);
          const yrs = Math.round(22 * eout(prog(t, 3.3, 2.4)));
          lbl = `<span class="big">${yrs} Jahre</span><small>Teleskop „Swift“ · seit 2004 im All</small>`;
        } else if (t < 9.4) {
          // Nahaufnahme: so schwer wie ein Auto
          const f = prog(t, 6.27, 3.13);
          earthG.position.set(0, -4.2, -2);
          sat.position.set(0, 0.2, 0); sat.rotation.set(0.35, -0.6 + f * 1.4, 0.15); sat.scale.setScalar(1);
          setCam(V(0, 0.6, lerp(9, 7.8, eio(f))), V(0, 0.1, 0));
          sunDir.set(-0.6, 0.6, 0.7).normalize();
          lbl = t > 6.9 ? `<span class="big">≈ 1.450 kg</span><small>so schwer wie ein Auto</small>` : "";
        } else if (t < 11.46) {
          // Die Sonne wird wild
          const f = prog(t, 9.4, 2.06);
          sunDir.set(-1, 0.25, 0.2).normalize();
          earthG.position.set(1.6, -2.2, 0);
          setCam(V(0.5, 0.8, 15), V(-0.5, 0.6, 0));
          sun.position.set(-1.6, 3.4, -4); sun.scale.setScalar(lerp(4.5, 6, eio(f)) + Math.sin(t * 9) * 0.2); sun.material.opacity = 1;
          flares.forEach((s, i) => { const a = (i / flares.length) * 6.283 + rnd() * 0.3; const ph = (t * (0.8 + rnd()) + rnd()) % 1; const d = 1 + ph * (2.5 + rnd() * 2); s.position.set(-1.6 + Math.cos(a) * d * 0.6, 3.4 + Math.sin(a) * d * 0.6, -4); s.scale.setScalar((1 - ph) * (0.25 + rnd() * 0.35)); s.material.opacity = (1 - ph) * 0.7 * prog(t, 9.6, 0.4); });
          sat.visible = false;
          R.toneMappingExposure = 1 + f * 0.2;
          lbl = `Die Sonne wird wild<small>riesige Ausbrüche</small>`;
        } else if (t < 13.6) {
          // Luft bläht sich auf
          const f = eio(prog(t, 11.46, 1.8));
          setCam(V(0, 1.2, 11), V(0, -0.1, 0), 1.4);
          atm.scale.setScalar(1 + f * 0.05); atmU.glow.value = 1 + f * 0.3; atmU.tint.value = f * 0.6;
          haze.scale.setScalar(1 + f * 0.16); haze.material.uniforms.a.value = f * 0.9;
          orbitLine.scale.setScalar(ORB); orbitLine.rotation.set(Math.PI / 2 - INC, 0, 0); orbitLine.material.opacity = 0.5;
          sat.position.copy(orbitPos(0.6 + t * 0.35, ORB)); sat.lookAt(0, 0, 0); sat.scale.setScalar(0.17);
          lbl = `Die Luft bläht sich auf<small>und reicht plötzlich viel höher</small>`;
        } else if (t < 17.0) {
          // Abbremsen: Spirale nach unten
          const f = prog(t, 13.6, 3.4);
          setCam(V(0, 2.4, 11.5), V(0, -0.2, 0), 1.4);
          atm.scale.setScalar(1.05); atmU.glow.value = 1.3; atmU.tint.value = 0.6; haze.scale.setScalar(1.16); haze.material.uniforms.a.value = 0.9;
          const r = lerp(ORB, 2.95, eio(f)); const ang = 0.6 + 13.6 * 0.35 + (t - 13.6) * 0.5;
          sat.position.copy(orbitPos(ang, r)); sat.lookAt(0, 0, 0); sat.scale.setScalar(0.17);
          trail.forEach((s, i) => { if (i > 24) return; const k = i / 24; const p = orbitPos(ang - k * 0.6, lerp(ORB, 2.95, eio(Math.max(0, f - k * 0.15)))); s.position.copy(p); s.scale.setScalar(0.12 * (1 - k)); s.material.opacity = 0.5 * (1 - k); });
          lbl = `Bremsen … bremsen …<small>und es sinkt immer tiefer</small>`;
        } else if (t < 20.15) {
          // Rettungsmission scheitert
          const f = prog(t, 17.0, 3.15);
          earthG.position.set(0, -4.5, -2);
          sat.position.set(0.9, 0.4, 0); sat.rotation.set(0.3, -0.8, 0.1); sat.scale.setScalar(0.55);
          rescue.visible = true;
          const appr = eout(prog(t, 17.0, 1.4));
          const fail = prog(t, 18.6, 1.5);
          rescue.position.set(lerp(-3.5, -0.9, appr) - fail * 2.2, lerp(1.6, 0.6, appr) + fail * 1.2, fail * 0.8);
          rescue.rotation.set(fail * 9, fail * 6, fail * 4); rescue.scale.setScalar(0.35);
          setCam(V(0, 0.7, 7).add(shake(t, 18.6, 0.05)), V(0, 0.4, 0));
          sunDir.set(-0.4, 0.6, 0.8).normalize();
          lbl = t < 18.6 ? `Rettung im Anflug …` : `<span class="big red">GESCHEITERT</span><small>die Rettungs-Sonde geriet außer Kontrolle</small>`;
        } else if (t < 23.46) {
          // Verglüht über Indonesien
          const f = prog(t, 20.15, 3.3);
          earth.rotation.y = -1.2 + 20.15 * 0.03;
          const tgt = ll(2, 99); const dir = tgt.clone().normalize();
          sunDir.copy(dir).add(V(-0.3, 0.3, 0)).normalize();
          setCam(dir.clone().multiplyScalar(lerp(9, 6.5, eio(f))).add(V(0, 0.8, 0)), tgt);
          const start = ll(14, 70, 3.15), end = ll(2, 99, 2.66);
          const k = eio(prog(t, 20.3, 2.6)); const head = start.clone().lerp(end, k);
          sat.position.copy(head); sat.scale.setScalar(0.05); sat.rotation.set(t * 4, t * 3, 0); sat.visible = k < 0.85;
          trail.forEach((s, i) => { const q = i / trail.length; const p = start.clone().lerp(end, Math.max(0, k - q * 0.35)); s.position.copy(p); s.scale.setScalar((0.22 * (1 - q) + 0.03) * (0.5 + k)); s.material.opacity = (1 - q) * (k < 1 ? 1 : 1 - prog(t, 22.9, 0.5)); });
          const rp = ll(2, 99, 2.63); ring.position.copy(rp); ring.lookAt(rp.clone().multiplyScalar(2)); ring.material.opacity = prog(t, 22.2, 0.3); ring.scale.setScalar(1 + 0.15 * Math.sin(t * 6));
          flashEl.style.opacity = t > 22.8 && t < 23.2 ? 0.35 * (1 - (t - 22.8) / 0.4) : 0;
          lbl = t > 20.4 ? `Verglüht über Indonesien<small>am 4. November 2026</small>` : "";
        } else if (t < 27.2) {
          // 22 Jahre Explosionen beobachtet
          const f = prog(t, 23.46, 3.74);
          setCam(V(0, 0.4, 13 + f * 2), V(0, 3, -10));
          sat.position.set(0.4, 1.0, 8.5); sat.rotation.set(-0.5, 0.4 + f * 0.3, 0.2); sat.scale.setScalar(0.2);
          earthG.position.set(0, -4.2, 0);
          bursts.forEach((s, i) => { const t0 = 23.6 + i * 0.26; const d = t - t0; if (d < 0) return; const life = Math.max(0, 1 - d / 1.4); seed = 1000 + i * 7919; rnd(); rnd(); s.position.set((rnd() - 0.5) * 9, 2 + rnd() * 6, -6 - rnd() * 8); s.scale.setScalar((1 + rnd() * 1.6) * (0.3 + Math.min(1, d * 8)) * (1 + 0.6 * Math.max(0, 1 - d * 3))); s.material.opacity = life; });
          lbl = `Die stärksten Explosionen im All<small>Swift hat über 1.000 davon entdeckt</small>`;
        } else {
          const f = prog(t, 27.2, 2.8);
          setCam(V(0, 0.8, lerp(12, 13.5, f)), V(0, -0.2, 0), 1.4);
          sat.visible = false;
          lbl = "";
        }
        atm.position.set(0, 0, 0);
        dl.position.copy(sunDir).multiplyScalar(10);
        orbitLine.visible = orbitLine.material.opacity > 0.01; ring.visible = ring.material.opacity > 0.01; haze.visible = haze.material.uniforms.a.value > 0.01;
        [sun, ...flares, ...trail, ...bursts].forEach((s) => (s.visible = s.material.opacity > 0.01));
        R.render(sc, cam);
        captions(t); label(lbl);
      }

      const ready = Promise.all(["tex-day", "tex-night"].map((id) => { const im = document.getElementById(id); return im.complete ? Promise.resolve(im) : new Promise((r) => (im.onload = () => r(im))); })).then(([a, b]) => {
        const mk = (im) => { const tx = new THREE.Texture(im); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; tx.needsUpdate = true; return tx; };
        U.d.value = mk(a); U.n.value = mk(b); renderAt(lastT);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.scene = ready;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
    </script>
  </body>
