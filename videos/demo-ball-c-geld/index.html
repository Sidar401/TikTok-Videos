<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Demo-Shop-Vorlage HundeWissenTv 2.0 (ohne KI-Clips) – erzeugt von scripts/shop_demo.py */
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      :root { --brand: #DB8622; --dark: #1B1D1F; --font: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; font-family: var(--font); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .bgfill { position: absolute; inset: -80px; }
      .pglow { position: absolute; left: 140px; top: 560px; width: 800px; height: 800px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 65%); }
      .dark .pglow { background: radial-gradient(circle, rgba(219,134,34,0.6) 0%, rgba(219,134,34,0) 65%); }
      .prod { position: absolute; left: 165px; top: 640px; width: 750px; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.35)); }
      .shadow { position: absolute; left: 290px; top: 1270px; width: 500px; height: 60px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 70%); }
      .haupt { position: absolute; left: 0; width: 1080px; top: 700px; text-align: center; font-size: 420px; line-height: 1;
        font-family: "Noto Color Emoji", sans-serif; }
      .emo { position: absolute; font-size: 120px; line-height: 1; width: 140px; text-align: center;
        font-family: "Noto Color Emoji", sans-serif; }

      /* Untertitel oben, nie über dem Produkt */
      .cap { position: absolute; left: 60px; width: 960px; top: 230px; text-align: center; z-index: 5; }
      .capin { font-weight: 900; font-size: 84px; line-height: 1.12; color: #fff;
        -webkit-text-stroke: 14px #000; paint-order: stroke fill; text-shadow: 0 10px 28px rgba(0,0,0,0.45); }
      .w { display: inline-block; }
      .w.hot { color: var(--brand); }
      .bg-orange .w.hot { color: #FFE14D; }

      .gross { position: absolute; left: 0; width: 1080px; top: 1380px; text-align: center; z-index: 4; }
      .gross span { display: inline-block; background: #fff; color: var(--dark); font-weight: 900; font-size: 170px;
        line-height: 1; padding: 20px 56px 30px; border-radius: 36px; letter-spacing: -4px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45); border: 8px solid var(--brand); }
      .durch { position: absolute; left: 0; width: 1080px; top: 1420px; text-align: center; z-index: 4; }
      .durch span { display: inline-block; color: #fff; font-weight: 900; font-size: 96px;
        -webkit-text-stroke: 10px #000; paint-order: stroke fill; }
      .durch span { position: relative; }
      .durch i { position: absolute; left: -10px; right: -10px; top: 50%; height: 18px; background: #E24B4B;
        border-radius: 9px; transform-origin: left center; transform: rotate(-4deg); }
      .chips { position: absolute; left: 60px; width: 960px; top: 1400px; display: flex; flex-wrap: wrap;
        justify-content: center; gap: 22px; z-index: 4; }
      .chip { background: #fff; color: var(--dark); font-weight: 900; font-size: 52px; padding: 18px 34px;
        border-radius: 999px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); border: 6px solid var(--brand); }

      /* Endkarte */
      #end { position: absolute; inset: 0; z-index: 8;
        background: radial-gradient(circle at 50% 38%, #3a2a17 0%, var(--dark) 60%); }
      #glow { position: absolute; left: 140px; top: 330px; width: 800px; height: 800px; border-radius: 50%;
        background: radial-gradient(circle, rgba(219,134,34,0.55) 0%, rgba(219,134,34,0) 65%); }
      #e-badge { position: absolute; top: 230px; left: 0; width: 1080px; text-align: center; }
      #e-badge span { display: inline-block; background: var(--brand); color: #fff; font-weight: 900; font-size: 44px;
        padding: 12px 34px; border-radius: 999px; letter-spacing: 1px; }
      #e-prod { position: absolute; left: 215px; top: 380px; width: 650px; }
      #e-stars { position: absolute; top: 880px; left: 0; width: 1080px; text-align: center; color: #fff;
        font-weight: 800; font-size: 44px; }
      #e-stars b { color: #F2C418; }
      #e-price { position: absolute; top: 950px; left: 0; width: 1080px; text-align: center; }
      #e-price span { display: inline-block; background: #fff; color: var(--dark); font-weight: 900; font-size: 150px;
        line-height: 1; padding: 18px 50px 26px; border-radius: 34px; letter-spacing: -3px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      #e-cta { position: absolute; top: 1170px; left: 110px; width: 860px; text-align: center; background: var(--brand);
        color: #fff; font-weight: 900; font-size: 58px; padding: 30px 20px; border-radius: 999px;
        box-shadow: 0 16px 50px rgba(219,134,34,0.45); }
      #e-arrow { position: absolute; top: 1330px; left: 495px; width: 90px; height: 100px; }
      #e-brand { position: absolute; top: 1460px; left: 0; width: 1080px; display: flex; justify-content: center;
        align-items: center; gap: 14px; color: rgba(255,255,255,0.8); font-weight: 800; font-size: 36px; }
      #e-brand img { width: 64px; height: 64px; border-radius: 50%; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 20; }
    
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.00" data-width="1080" data-height="1920">
      <div id="scenes">
        <div id="s1" class="clip scene dark bg-dunkel" data-start="0.00" data-duration="3.00" data-track-index="1">
          <div class="bgfill" style="background:radial-gradient(circle at 50% 45%, #3a2a17 0%, #1B1D1F 65%)"></div>
          <div class="haupt" id="h1">🥱</div>
          <div class="emo e1" style="left:150px;top:620px">🥱</div>
          <div class="emo e1" style="left:840px;top:660px">🛋️</div>
          <div class="emo e1" style="left:110px;top:1180px">🐶</div>
          <div class="cap" id="c1"><div class="capin"><span class="w">Wenn</span> <span class="w">dein</span> <span class="w">Hund</span><br /><span class="w">sich</span> <span class="w hot">langweilt…</span></div></div>
        </div>
        <div id="s2" class="clip scene dark bg-dunkel" data-start="3.00" data-duration="3.00" data-track-index="1">
          <div class="bgfill" style="background:radial-gradient(circle at 50% 45%, #3a2a17 0%, #1B1D1F 65%)"></div>
          <div class="haupt" id="h2">🛋️</div>
          <div class="emo e2" style="left:150px;top:620px">💸</div>
          <div class="emo e2" style="left:840px;top:660px">💸</div>
          <div class="emo e2" style="left:110px;top:1180px">😬</div>
          <div class="durch" id="du2"><span>Neues Sofa: 600 €<i></i></span></div>
          <div class="cap" id="c2"><div class="capin"><span class="w">…wird&#x27;s</span> <span class="w hot">teuer</span> <span class="w">💸</span></div></div>
        </div>
        <div id="s3" class="clip scene dark bg-orange" data-start="6.00" data-duration="3.00" data-track-index="1">
          <div class="bgfill" style="background:radial-gradient(circle at 50% 45%, #F3A64C 0%, #DB8622 60%, #B86A12 100%)"></div>
          <div class="pglow" id="g3"></div>
          <img class="prod" id="p3" src="assets/produkt.png" alt="" />
          <div class="shadow" id="sh3"></div>
          <div class="gross" id="gr3"><span>15 €</span></div>
          <div class="cap" id="c3"><div class="capin"><span class="w">Die</span> <span class="w">Lösung</span><br /><span class="w">für</span> <span class="w hot">15</span> <span class="w hot">€</span></div></div>
        </div>
        <div id="s4" class="clip scene bg-hell" data-start="9.00" data-duration="3.00" data-track-index="1">
          <div class="bgfill" style="background:radial-gradient(circle at 50% 45%, #FFFFFF 0%, #FFEBD2 70%, #F8D6AE 100%)"></div>
          <div class="pglow" id="g4"></div>
          <img class="prod" id="p4" src="assets/produkt.png" alt="" />
          <div class="shadow" id="sh4"></div>
          <div class="emo e4" style="left:150px;top:620px">🛋️</div>
          <div class="emo e4" style="left:840px;top:660px">✅</div>
          <div class="emo e4" style="left:110px;top:1180px">❤️</div>
          <div class="cap" id="c4"><div class="capin"><span class="w">Und</span> <span class="w">dein</span> <span class="w">Sofa</span><br /><span class="w">bleibt</span> <span class="w hot">heil</span> <span class="w">😅</span></div></div>
        </div>
      </div>

      <div id="end" class="clip" data-start="12.00" data-duration="3.00" data-track-index="1" data-track-kind="graphics">
        <div id="glow"></div>
        <div id="e-badge"><span>Bestseller</span></div>
        <img id="e-prod" src="assets/produkt.png" alt="" />
        <div id="e-stars"><b>★★★★★</b> 4,1 · 12.500× verkauft</div>
        <div id="e-price"><span>nur 15,17 €</span></div>
        <div id="e-cta">Unten im Warenkorb 🛒</div>
        <svg id="e-arrow" viewBox="0 0 100 110"><path d="M50 8 L50 90 M18 60 L50 94 L82 60" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <div id="e-brand"><img src="assets/beagle.png" alt="" />HundeWissenTv 2.0</div>
      </div>

      
      <div id="flash" class="clip" data-start="0" data-duration="15.00" data-track-index="3"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Szene 1
      tl.fromTo("#s1 .bgfill", { scale: 1.15 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 0.0);
      tl.fromTo("#h1", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 0.05);
      tl.to("#h1", { scale: 1.06, rotation: 4, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.50);
      tl.fromTo("#s1 .emo", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.5)", stagger: 0.12 }, 0.35);
      tl.to("#s1 .emo", { y: -25, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.08 }, 0.90);
      tl.fromTo("#c1 .capin", { scale: 1 }, { scale: 1.07, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.4);

      // Szene 2
      tl.fromTo("#s2 .bgfill", { scale: 1.15 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 3.0);
      tl.fromTo("#h2", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 3.05);
      tl.to("#h2", { scale: 1.06, rotation: 4, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.50);
      tl.fromTo("#s2 .emo", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.5)", stagger: 0.12 }, 3.35);
      tl.to("#s2 .emo", { y: -25, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.08 }, 3.90);
      tl.fromTo("#du2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, 3.30);
      tl.fromTo("#du2 i", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.in" }, 3.90);
      tl.fromTo("#c2 .w", { scale: 0.4, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.18, ease: "back.out(2.4)", stagger: 0.07 }, 3.05);
      tl.fromTo("#flash", { opacity: 0.5 }, { opacity: 0, duration: 0.15, immediateRender: false }, 3.00);

      // Szene 3
      tl.fromTo("#s3 .bgfill", { scale: 1.15 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 6.0);
      tl.fromTo("#p3", { y: 900, rotation: 25, opacity: 1 }, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 6.05);
      tl.fromTo("#g3", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 6.10);
      tl.fromTo("#sh3", { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5 }, 6.20);
      tl.to("#p3", { rotation: 6, y: -18, duration: 0.32, yoyo: true, repeat: 5, ease: "sine.inOut" }, 6.62);
      tl.to("#g3", { scale: 1.08, duration: 2.30, ease: "sine.inOut" }, 6.70);
      tl.fromTo("#gr3", { scale: 2.6, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.28, ease: "power4.out" }, 6.45);
      tl.fromTo("#s3", { x: -14 }, { x: 0, duration: 0.25, ease: "elastic.out(1, 0.3)" }, 6.73);
      tl.fromTo("#c3 .w", { scale: 0.4, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.18, ease: "back.out(2.4)", stagger: 0.07 }, 6.05);
      tl.fromTo("#flash", { opacity: 0.5 }, { opacity: 0, duration: 0.15, immediateRender: false }, 6.00);

      // Szene 4
      tl.fromTo("#s4 .bgfill", { scale: 1.15 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 9.0);
      tl.fromTo("#p4", { scale: 0.2, opacity: 0 }, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 9.05);
      tl.fromTo("#g4", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 9.10);
      tl.fromTo("#sh4", { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5 }, 9.20);
      tl.to("#p4", { rotation: 6, y: -18, duration: 0.32, yoyo: true, repeat: 5, ease: "sine.inOut" }, 9.62);
      tl.to("#g4", { scale: 1.08, duration: 2.30, ease: "sine.inOut" }, 9.70);
      tl.fromTo("#s4 .emo", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.5)", stagger: 0.12 }, 9.35);
      tl.to("#s4 .emo", { y: -25, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.08 }, 9.90);
      tl.fromTo("#c4 .w", { scale: 0.4, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.18, ease: "back.out(2.4)", stagger: 0.07 }, 9.05);
      tl.fromTo("#flash", { opacity: 0.5 }, { opacity: 0, duration: 0.15, immediateRender: false }, 9.00);

      // Endkarte
      tl.fromTo("#flash", { opacity: 0.8 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 12.00);
      tl.fromTo("#glow", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 12.00);
      tl.fromTo("#e-badge", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 12.00 + 0.05);
      tl.fromTo("#e-prod", { y: 400, rotation: -20, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 12.00 + 0.05);
      tl.to("#e-prod", { rotation: 4, y: -12, duration: 0.35, yoyo: true, repeat: 7, ease: "sine.inOut" }, 12.00 + 0.6);
      tl.fromTo("#e-stars", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, 12.00 + 0.35);
      tl.fromTo("#e-price", { scale: 1.8, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.3, ease: "power4.out" }, 12.00 + 0.5);
      tl.fromTo("#e-cta", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 12.00 + 0.8);
      tl.to("#e-cta", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 12.00 + 1.2);
      tl.fromTo("#e-arrow", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 }, 12.00 + 1.0);
      tl.to("#e-arrow", { y: 26, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 12.00 + 1.25);
      tl.fromTo("#e-brand", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.00 + 1.0);

      
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
