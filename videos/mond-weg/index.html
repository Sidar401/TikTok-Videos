      sc.add(new THREE.Points(pg, pmat));

      // Punkt auf der Erde (Breite, Länge) → Welt
      const ll = (lat, lon, r = 2.6) => { earthG.updateMatrixWorld(true); const la = (lat * Math.PI) / 180, lo = (lon * Math.PI) / 180; return earth.localToWorld(V(Math.cos(la) * Math.cos(lo) * r, Math.sin(la) * r, -Math.cos(la) * Math.sin(lo) * r)); };
      // Marker-Ring
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.075, 0.095, 64), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
      sc.add(ring);

      // ---------- Kamera-Fahrten ----------
      // Jede Szene: [start, ende, fn(f, t)] → setzt alles
      const MOON0 = V(1.3, 2.4, 1.2);
      function base() {
        earthG.rotation.set(0, 0, 0.41); earth.rotation.set(0, -1.9, 0);
        moon.visible = true; moon.scale.setScalar(1); moon.material.opacity = 1; glow.visible = true;
        pmat.opacity = 0; tide.material.opacity = 0; tideRim.material.opacity = 0; ring.material.opacity = 0; axis.material.opacity = 0;
        U.ice.value = 0; U.heat.value = 0; U.dark.value = 0; atmU.heat.value = 0; atmU.dark.value = 0;
        starMat.opacity = 0.85; starMat.size = 2.4; mwMat.opacity = 0; R.toneMappingExposure = 1; sunDir.set(-0.75, 0.35, 0.75).normalize();
        flashEl.style.opacity = 0;
      }
      function setCam(p, look) { cam.position.copy(p); cam.lookAt(look); }
      function shake(t, t0, amp) { const d = t - t0; if (d < 0 || d > 0.6) return V(0, 0, 0); const k = amp * (1 - d / 0.6); return V(Math.sin(d * 90) * k, Math.cos(d * 77) * k, 0); }

      function renderAt(t) {
        if (!U.d.value) return;
        base(); seed = 99;
        const earthPos = V(-0.2, -1.5, 0); earthG.position.copy(earthPos);
        let lbl = "";
        if (t < 3.08) {
          // Hook: Erde + Mond, Mond zerfällt bei "verschwindet"
          const f = t / 3.08;
          setCam(V(lerp(0.6, -0.2, f), lerp(0.4, 0.1, f), lerp(15.5, 13.2, eio(f))).add(shake(t, 2.3, 0.08)), V(0, 0.3, 0));
          earth.rotation.y = -1.9 + t * 0.03;
          const k = prog(t, 2.25, 0.5);
          moon.position.copy(MOON0); moon.scale.setScalar(1 - eio(k)); moon.visible = k < 1;
          glow.material.opacity = 1 - k;
          if (t > 2.25) {
            const d = t - 2.25; pmat.opacity = Math.max(0, 1 - d / 0.9);
            for (let i = 0; i < NP; i++) { const q = pdir[i], s = 0.75 + d * q[3] * 2.2; pp[i * 3] = MOON0.x + q[0] * s; pp[i * 3 + 1] = MOON0.y + q[1] * s; pp[i * 3 + 2] = MOON0.z + q[2] * s; }
            pg.attributes.position.needsUpdate = true;
          }
          flashEl.style.opacity = t > 2.25 && t < 2.6 ? 0.55 * (1 - (t - 2.25) / 0.35) : 0;
        } else if (t < 5.53) {
          // Dunkel: zur Nachtseite
          moon.visible = false; glow.visible = false;
          const f = eio(prog(t, 3.08, 2.3));
          earth.rotation.y = -1.9 + t * 0.03;
          const p = V(lerp(-0.2, 7.5, f), lerp(0.1, 1.0, f), lerp(13.2, 8.5, f));
          setCam(p, V(lerp(0, -0.2, f), lerp(0.3, -1.0, f), 0));
          const dk = prog(t, 3.5, 0.8) * 0.45 + prog(t, 4.5, 0.6) * 0.4;
          U.dark.value = dk * 0.6; atmU.dark.value = dk; R.toneMappingExposure = 1 - dk * 0.35;
          starMat.opacity = 0.5;
          lbl = t > 4.5 ? "Keine Mondnacht mehr" : "";
        } else if (t < 8.47) {
          // Nur noch Sterne: Blick nach oben
          moon.visible = false; glow.visible = false;
          const f = eio(prog(t, 5.53, 2.9));
          earth.rotation.y = -1.9 + t * 0.03;
          setCam(V(7.5, 1.0, 8.5), V(lerp(-0.2, 10, f), lerp(-1.0, 9, f), lerp(0, -12, f)));
          U.dark.value = 0.6; atmU.dark.value = 0.85;
          starMat.opacity = lerp(0.6, 1, f); starMat.size = lerp(2.4, 4.2, f); mwMat.opacity = 0.9 * f;
          lbl = t > 6.4 ? "Nur noch Sterne ✦" : "";
        } else if (t < 12.18) {
          // Gezeiten: Wasser-Beule schrumpft auf 1/3
          moon.visible = true; glow.visible = false;
          const f = prog(t, 8.47, 0.8);
          earthG.position.set(0, -0.6, 0); earthG.rotation.set(0, 0, 0); earth.rotation.y = t * 0.08;
          setCam(V(0, lerp(2, 0.6, eio(f)), lerp(20, 15, eio(f))), V(0.6, -0.4, 0));
          moon.position.set(4.6, -0.6, 0); moon.scale.setScalar(0.75);
          const ghost = prog(t, 9.6, 0.8); moon.material.opacity = 1 - ghost * 0.85;
          const k = lerp(0.42, 0.14, eio(prog(t, 10.0, 1.6)));
          tide.position.set(0, -0.6, 0); tide.scale.set(1 + k, 1.01, 1.01); tide.material.opacity = 0.32 * f;
          tideRim.position.set(0, -0.6, 0); tideRim.scale.set(2.62 * (1 + k), 2.65, 1); tideRim.material.opacity = 0.9 * f;
          sunDir.set(0.2, 0.4, 1).normalize();
          const pct = Math.round(lerp(100, 33, eio(prog(t, 10.0, 1.6))));
          lbl = `Ebbe &amp; Flut<small>Stärke: ${pct} %</small>`;
        } else if (t < 14.5) {
          // Strände: Flug zur Nordsee-Küste
          moon.visible = false; glow.visible = false;
          earth.rotation.y = -1.9 + 12.18 * 0.03;
          const f = eio(prog(t, 12.18, 2.0));
          sunDir.set(0.1, 0.6, 1).normalize();
          const tgt = ll(54, 8); const dir = tgt.clone().sub(earthPos).normalize();
          setCam(earthPos.clone().add(dir.clone().multiplyScalar(lerp(12, 5.2, f))).add(V(0, lerp(1.5, 0.3, f), 0)), tgt);
          ring.position.copy(ll(54, 8, 2.63)); ring.lookAt(earthPos.clone().add(dir.multiplyScalar(10))); ring.material.opacity = prog(t, 12.8, 0.3);
          ring.scale.setScalar(1 + 0.15 * Math.sin(t * 6));
          sunDir.copy(cam.position).sub(earthPos).normalize().add(V(-0.25, 0.25, 0)).normalize(); lbl = t > 12.6 ? "Wattenmeer &amp; Strände<small>Muscheln, Krebse, Vögel</small>" : "";
        } else if (t < 16.88) {
          // Korallen: Great Barrier Reef
          moon.visible = false; glow.visible = false;
          earth.rotation.y = -1.9 + 12.18 * 0.03;
          const f = eio(prog(t, 14.5, 1.6));
          sunDir.set(0.3, -0.2, 1).normalize();
          const a = ll(54, 8), b = ll(-18, 147);
          const tgt = a.clone().lerp(b, f); const dir = tgt.clone().sub(earthPos).normalize();
          setCam(earthPos.clone().add(dir.clone().multiplyScalar(lerp(5.2, 4.8, Math.sin(f * Math.PI) * 0 + f) + Math.sin(f * Math.PI) * 3)), tgt);
          const rp = ll(-18, 147, 2.63); ring.position.copy(rp); ring.lookAt(rp.clone().add(rp.clone().sub(earthPos))); ring.material.opacity = prog(t, 15.6, 0.3);
          ring.scale.setScalar(1 + 0.15 * Math.sin(t * 6));
          sunDir.copy(cam.position).sub(earthPos).normalize().add(V(-0.25, 0.25, 0)).normalize(); lbl = t > 15.4 ? "Great Barrier Reef<small>Korallen vermehren sich bei Vollmond</small>" : "";
        } else if (t < 19.05) {
          // Das Schlimmste: langsamer Rückzug, rot
          moon.visible = false; glow.visible = false;
          const f = eio(prog(t, 16.88, 2.17));
          earthG.position.set(0, -0.2, 0); earth.rotation.y = t * 0.05;
          setCam(V(lerp(3, 0, f), lerp(1, 0.2, f), lerp(9, 16.5, f)), V(0, -0.2, 0));
          R.toneMappingExposure = lerp(1, 0.75, f); U.heat.value = f * 0.15; atmU.heat.value = f * 0.5;
          lbl = "";
        } else if (t < 21.47) {
          // Erde wackelt
          moon.visible = false; glow.visible = false;
          earthG.position.set(0, -0.2, 0); earth.rotation.y = t * 0.6;
          const w = prog(t, 19.5, 0.6);
          const tilt = 0.41 + w * (0.55 * Math.sin((t - 19.5) * 3.2) + 0.2 * Math.sin((t - 19.5) * 7.1));
          earthG.rotation.set(0.15 * w * Math.sin((t - 19.5) * 2.3), 0, tilt);
          axis.material.opacity = prog(t, 19.2, 0.3);
          setCam(V(0, 0.2, 16.5).add(shake(t, 20.6, 0.04)), V(0, -0.2, 0));
          lbl = `Neigung: ${Math.round(Math.abs(tilt) * 57.3)}°<small>heute stabil bei 23°</small>`;
        } else if (t < 25.57) {
          // Eiszeit ↔ Hitze
          moon.visible = false; glow.visible = false;
          earthG.position.set(0, -0.2, 0); earth.rotation.y = t * 0.25;
          earthG.rotation.z = 0.41 + 0.3 * Math.sin(t * 1.3);
          const ice = eio(prog(t, 21.6, 1.4)) * (1 - eio(prog(t, 23.6, 0.7)));
          const heat = eio(prog(t, 23.9, 1.0));
          U.ice.value = ice; U.heat.value = heat; atmU.heat.value = heat;
          setCam(V(0, 0.2, lerp(16.5, 15, prog(t, 21.47, 4))), V(0, -0.2, 0));
          sunDir.set(-0.3, 0.3, 1).normalize();
          lbl = t < 23.75 ? "❄ EISZEIT" : "🔥 HITZE";
          lbl += "<small>immer im Wechsel</small>";
        } else {
          // Der Mond kommt zurück + Schluss
          const f = eio(prog(t, 25.57, 1.6));
          earthG.position.set(-0.3, -1.6, 0); earth.rotation.y = -1.9 + t * 0.03;
          const k = eio(prog(t, 25.6, 0.8));
          moon.position.copy(MOON0); moon.scale.setScalar(k); glow.material.opacity = k;
          setCam(V(lerp(0.8, -0.3, f), lerp(0.6, 0.1, f), lerp(16, 13.5, f) - (t - 25.57) * 0.12), V(0, 0.3, 0));
          flashEl.style.opacity = t > 25.6 && t < 25.9 ? 0.3 * (1 - (t - 25.6) / 0.3) : 0;
          lbl = t < 27.4 ? "Unser Beschützer 🌙" : "";
        }
        axis.visible = axis.material.opacity > 0.01; tide.visible = tide.material.opacity > 0.01; tideRim.visible = tideRim.material.opacity > 0.01; ring.visible = ring.material.opacity > 0.01; mw.visible = mwMat.opacity > 0.01;
        dl.position.copy(sunDir).multiplyScalar(10);
        atm.position.copy(earthG.position); atm.scale.setScalar(1);
        glow.position.copy(moon.position).add(V(0, 0, -0.5)); glow.scale.set(3.6 * moon.scale.x, 3.6 * moon.scale.x, 1);
        R.render(sc, cam);
        captions(t); label(lbl);
      }

      // Texturen aus den <img>-Tags (Laden wird vom Renderer abgewartet)
      const ready = Promise.all(["tex-day", "tex-night"].map((id) => { const im = document.getElementById(id); return im.complete ? Promise.resolve(im) : new Promise((r) => (im.onload = () => r(im))); })).then(([a, b]) => {
        const mk = (im) => { const tx = new THREE.Texture(im); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; tx.needsUpdate = true; return tx; };
        U.d.value = mk(a); U.n.value = mk(b); renderAt(lastT);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.scene = ready;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; renderAt(lastT); });
      window.__renderAt = renderAt;
    </script>
  </body>
</html>
