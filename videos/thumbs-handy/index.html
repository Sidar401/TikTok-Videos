<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 60%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:230px;width:1080px;font-weight:900;font-size:94px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Dein Handyvertrag</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">ist ZU TEUER</span></div></div><div style="position:absolute;left:260px;top:560px;padding:8px 30px 12px;border-radius:20px;background:#2fd27a;color:#111;font-weight:900;font-size:72px;white-space:nowrap;box-shadow:0 0 40px #2fd27a99;transform:rotate(-4deg);z-index:3">+260 € sparen</div><div style="position:absolute;left:300px;top:820px;width:480px;height:860px;border-radius:70px;background:#16191b;border:10px solid #ff8a1f;box-shadow:0 0 90px #ff8a1f77, 0 40px 60px #000;transform:rotate(-6deg);z-index:2;padding:70px 40px"><div style="width:120px;height:18px;border-radius:9px;background:#2a2f33;margin:-40px auto 50px"></div><div style="font-weight:800;font-size:40px;color:#9aa3a8;letter-spacing:2px">VERTRAG</div><div style="font-weight:900;font-size:80px;white-space:nowrap;color:#fff;margin:10px 0 40px">50 €<span style="font-size:44px;color:#9aa3a8"> /Monat</span></div><div style="height:4px;background:#ffffff33;margin-bottom:34px"></div><div style="font-weight:800;font-size:40px;color:#9aa3a8;letter-spacing:2px">NACH 2 JAHREN</div><div style="font-weight:900;font-size:92px;white-space:nowrap;color:#ff4d4d;text-shadow:0 0 40px #ff4d4daa">1.200 €</div></div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
