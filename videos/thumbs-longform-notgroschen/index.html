<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:220px;width:1080px;font-weight:900;font-size:100px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Dein Notgroschen</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff4d4d;color:#fff;box-shadow:0 0 60px #ff4d4d88">reicht nicht!</span></div></div><div style="position:absolute;left:300px;top:640px;width:480px;height:640px;border:14px solid #ffffffdd;border-top:none;border-radius:0 0 90px 90px;overflow:hidden;background:#ffffff0d;box-shadow:0 0 90px #ff4d4d55;z-index:2"><div style="position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#ff4d4d,#ff4d4d99)"></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 6px 0 #000"><div style="font-size:190px;line-height:1">3</div><div style="font-size:84px">Monate</div></div></div><div style="position:absolute;left:276px;top:596px;width:528px;height:56px;border-radius:18px;background:#c9a46b;box-shadow:0 12px 24px #000;z-index:3"></div><div style="position:absolute;left:200px;top:1380px;padding:8px 30px 12px;border-radius:20px;background:#ff4d4d;color:#fff;font-weight:900;font-size:80px;white-space:nowrap;box-shadow:0 0 40px #ff4d4d99;transform:rotate(-3deg);z-index:3">Jeder 2. betroffen</div><div style="position:absolute;left:240px;top:1580px;padding:8px 30px 12px;border-radius:20px;background:#2fd27a;color:#111;font-weight:900;font-size:66px;white-space:nowrap;box-shadow:0 0 40px #2fd27a99;transform:rotate(2deg);z-index:3">So viel brauchst du</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
