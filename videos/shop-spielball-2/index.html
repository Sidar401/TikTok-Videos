<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* TikTok-Shop-Video 2: „12.500× verkauft – warum?“ (HundeWissenTv 2.0) */
      :root {
        --brand: #DB8622;
        --dark: #353A3D;
        --creme: #FAF5EF;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
      #root { position: relative; width: 100%; height: 100%; background: var(--dark); font-family: var(--font); }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      .dark { background: radial-gradient(circle at 50% 45%, #4a5054 0%, var(--dark) 65%); }
      .orange { background: var(--brand); }
      .bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .card {
        position: absolute; left: 70px; top: 520px; width: 940px; height: 800px;
        border-radius: 44px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      }
      .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .big { position: absolute; left: 0; width: 1080px; text-align: center; color: #fff; font-weight: 900; }
      .label {
        position: absolute; left: 0; top: 250px; width: 1080px; text-align: center;
      }
      .label span {
        display: inline-block; background: #fff; color: var(--dark); font-weight: 900; font-size: 74px;
        padding: 14px 40px 20px; border-radius: 26px; box-shadow: 0 12px 34px rgba(0,0,0,0.35);
      }
      .num { position: absolute; top: 400px; left: 0; width: 1080px; text-align: center; color: rgba(255,255,255,0.18); font-weight: 900; font-size: 64px; }

      /* 1: Hook */
      #s1-count { top: 270px; font-size: 220px; letter-spacing: -6px; line-height: 1; color: var(--brand); }
      #s1-sold { top: 500px; font-size: 92px; }
      #s1-why { top: 640px; }
      #s1-why span { display: inline-block; background: #fff; color: var(--dark); font-size: 104px; padding: 6px 44px 16px; border-radius: 28px; }
      #s1-ball { position: absolute; left: 270px; top: 860px; width: 540px; }

      /* 3: Gründe */
      .prod { position: absolute; left: 165px; top: 560px; width: 750px; }
      #s3c-ball { left: 240px; top: 640px; width: 600px; }
      .wave { position: absolute; left: 140px; top: 520px; width: 800px; height: 800px; }
      #s3d-usb { position: absolute; left: 640px; top: 580px; width: 260px; }
      #s3d-ball { left: 150px; top: 700px; width: 520px; }

      /* 4: Preis */
      #s4-intro { top: 330px; font-size: 80px; }
      #s4-price { top: 520px; font-size: 250px; letter-spacing: -6px; line-height: 1; color: var(--brand); }
      #s4-stars { top: 840px; font-size: 64px; color: #F2C418; }
      #s4-info { top: 940px; font-size: 46px; font-weight: 700; color: rgba(255,255,255,0.85); }
      #s4-ball { position: absolute; left: 340px; top: 1040px; width: 400px; }

      /* 5: CTA */
      #s5-brand {
        position: absolute; top: 210px; left: 0; width: 1080px;
        display: flex; justify-content: center; align-items: center; gap: 16px;
        color: #fff; font-weight: 800; font-size: 44px;
      }
      #s5-brand img { width: 92px; height: 92px; border-radius: 50%; border: 4px solid #fff; }
      #s5-t { top: 400px; font-size: 104px; line-height: 1.05; }
      #s5-ball { position: absolute; left: 290px; top: 640px; width: 500px; }
      #s5-cta {
        position: absolute; top: 1090px; left: 120px; width: 840px; text-align: center;
        background: var(--dark); color: #fff; font-weight: 900; font-size: 56px;
        padding: 30px 20px; border-radius: 999px;
      }
      #s5-arrow { position: absolute; top: 1240px; left: 490px; width: 100px; height: 110px; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <!-- 1: Hook – Zahl steht ab Frame 0 -->
      <div id="s1" class="scene dark clip" data-start="0" data-duration="2.6" data-track-index="1" data-track-kind="graphics">
        <div id="s1-count" class="big">12.500×</div>
        <div id="s1-sold" class="big">verkauft.</div>
        <div id="s1-why" class="big"><span>Warum?</span></div>
        <img id="s1-ball" src="assets/ball.png" alt="" />
      </div>

      <!-- 2: Darum -->
      <div id="s2" class="scene clip" data-start="2.6" data-duration="1.8" data-track-index="1" data-track-kind="graphics">
        <img class="bg" src="assets/szene-bg.jpg" alt="" />
        <div id="s2-card" class="card"><img src="assets/szene.jpg" alt="" /></div>
        <div id="s2-t" class="label"><span>Darum 👇</span></div>
      </div>

      <!-- 3a: Rollt allein -->
      <div id="s3a" class="scene orange clip" data-start="4.4" data-duration="1.2" data-track-index="1" data-track-kind="graphics">
        <img id="s3a-ball" class="prod" src="assets/ball.png" alt="" />
        <div id="s3a-t" class="label"><span>Rollt von allein</span></div>
      </div>

      <!-- 3b: Berührung -->
      <div id="s3b" class="scene clip" data-start="5.6" data-duration="1.2" data-track-index="1" data-track-kind="graphics">
        <img class="bg" src="assets/spiel-bg.jpg" alt="" />
        <div id="s3b-card" class="card"><img src="assets/spiel.jpg" alt="" style="object-position:50% 40%" /></div>
        <div id="s3b-t" class="label"><span>Startet bei Berührung</span></div>
      </div>

      <!-- 3c: Vogelgeräusche -->
      <div id="s3c" class="scene dark clip" data-start="6.8" data-duration="1.2" data-track-index="1" data-track-kind="graphics">
        <svg class="wave" viewBox="0 0 800 800">
          <g fill="none" stroke="#DB8622" stroke-width="16" stroke-linecap="round">
            <path id="w1" d="M240 300 A200 200 0 0 0 240 560" />
            <path id="w2" d="M170 240 A290 290 0 0 0 170 620" />
            <path id="w3" d="M560 300 A200 200 0 0 1 560 560" />
            <path id="w4" d="M630 240 A290 290 0 0 1 630 620" />
          </g>
        </svg>
        <img id="s3c-ball" class="prod" src="assets/ball.png" alt="" />
        <div id="s3c-t" class="label"><span>Vogel-Geräusche 🐦</span></div>
      </div>

      <!-- 3d: USB -->
      <div id="s3d" class="scene orange clip" data-start="8" data-duration="1.2" data-track-index="1" data-track-kind="graphics">
        <img id="s3d-ball" class="prod" src="assets/ball.png" alt="" />
        <img id="s3d-usb" src="assets/usb.png" alt="" />
        <div id="s3d-t" class="label"><span>USB statt Batterien</span></div>
      </div>

      <!-- 4: Preis -->
      <div id="s4" class="scene dark clip" data-start="9.2" data-duration="2.8" data-track-index="1" data-track-kind="graphics">
        <div id="s4-intro" class="big">Und das Beste?</div>
        <div id="s4-price" class="big">15,17 €</div>
        <div id="s4-stars" class="big">★★★★☆ 4,1</div>
        <div id="s4-info" class="big">über 870 Bewertungen</div>
        <img id="s4-ball" src="assets/ball.png" alt="" />
      </div>

      <!-- 5: CTA -->
      <div id="s5" class="scene orange clip" data-start="12" data-duration="3" data-track-index="1" data-track-kind="graphics">
        <div id="s5-brand"><img src="assets/beagle.png" alt="" />HundeWissenTv 2.0</div>
        <div id="s5-t" class="big">Hol ihn dir,<br />bevor er weg ist</div>
        <img id="s5-ball" src="assets/ball.png" alt="" />
        <div id="s5-cta">Unten im Warenkorb 🛒</div>
        <svg id="s5-arrow" viewBox="0 0 100 110"><path d="M50 8 L50 90 M18 60 L50 94 L82 60" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>

      <div id="flash" class="clip" data-start="0" data-duration="15" data-track-index="3"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at, d = 0.35) =>
        tl.fromTo(sel, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2)" }, at);
      const slam = (sel, at) =>
        tl.fromTo(sel, { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, at);
      const flash = (at) =>
        tl.fromTo("#flash", { opacity: 0.8 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, at);

      // 1: Hook (Zahl ab Frame 0 sichtbar, pulsiert)
      tl.fromTo("#s1-count", { scale: 1 }, { scale: 1.08, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.1);
      slam("#s1-why", 0.9);
      tl.fromTo("#s1-ball", { y: 0 }, { y: -40, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.out" }, 0);
      tl.to("#s1-ball", { rotation: 7, duration: 0.17, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.8);

      // 2: Darum
      flash(2.6);
      tl.fromTo("#s2-card", { scale: 1.15 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 2.6);
      tl.fromTo("#s2-card img", { scale: 1 }, { scale: 1.12, duration: 1.8, ease: "none" }, 2.6);
      slam("#s2-t", 2.75);

      // 3a: rollt – Ball rollt rein und dreht sich
      flash(4.4);
      tl.fromTo("#s3a-ball", { x: -900, rotation: -200 }, { x: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, 4.4);
      tl.to("#s3a-ball", { rotation: 8, duration: 0.12, yoyo: true, repeat: 4, ease: "sine.inOut" }, 4.9);
      slam("#s3a-t", 4.45);

      // 3b: Berührung
      flash(5.6);
      tl.fromTo("#s3b-card", { scale: 1.15 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 5.6);
      tl.fromTo("#s3b-card img", { scale: 1 }, { scale: 1.12, duration: 1.2, ease: "none" }, 5.6);
      slam("#s3b-t", 5.65);

      // 3c: Vogelgeräusche – Schallwellen
      flash(6.8);
      pop("#s3c-ball", 6.8);
      ["#w1", "#w3"].forEach((w) => tl.fromTo(w, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.out" }, 6.95));
      ["#w2", "#w4"].forEach((w) => tl.fromTo(w, { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.out" }, 7.1));
      slam("#s3c-t", 6.85);

      // 3d: USB
      flash(8);
      pop("#s3d-ball", 8);
      tl.fromTo("#s3d-usb", { x: 400, rotation: 30 }, { x: 0, rotation: 0, duration: 0.35, ease: "back.out(1.6)" }, 8.15);
      slam("#s3d-t", 8.05);

      // 4: Preis
      flash(9.2);
      pop("#s4-intro", 9.25);
      slam("#s4-price", 9.9);
      tl.fromTo("#s4-price", { rotation: 0 }, { rotation: -2, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 10.15);
      pop("#s4-stars", 10.4);
      pop("#s4-info", 10.6);
      tl.fromTo("#s4-ball", { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 10.7);

      // 5: CTA
      flash(12);
      pop("#s5-brand", 12.05);
      slam("#s5-t", 12.1);
      tl.fromTo("#s5-ball", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 12.3);
      tl.to("#s5-ball", { rotation: 5, duration: 0.2, yoyo: true, repeat: 9, ease: "sine.inOut" }, 12.75);
      pop("#s5-cta", 12.6);
      tl.fromTo("#s5-arrow", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 }, 12.9);
      tl.to("#s5-arrow", { y: 26, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 13.15);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
