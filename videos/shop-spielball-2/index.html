<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* TikTok-Shop-Video 2: „12.500× verkauft – warum?“ (HundeWissenTv 2.0)
         ki1–ki5 = Higgsfield-Bilder (9:16), szene/spiel = echte Shop-Fotos */
      :root {
        --brand: #DB8622;
        --dark: #353A3D;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; font-family: var(--font); }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      .full { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* Echtes Produktfoto als Karte über unscharfem Hintergrund */
      .card {
        position: absolute; left: 70px; top: 520px; width: 940px; height: 800px;
        border-radius: 44px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      }
      .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* TikTok-Textsticker */
      .cap { position: absolute; left: 60px; width: 960px; top: 1040px; text-align: center; }
      .cap.top { top: 250px; }
      .cap span {
        display: inline; background: #fff; color: #111; font-weight: 800; font-size: 66px; line-height: 1.42;
        padding: 6px 22px; border-radius: 18px;
        -webkit-box-decoration-break: clone; box-decoration-break: clone;
      }
      .cap span.o { background: var(--brand); color: #fff; }

      /* CTA */
      #s7 { background: var(--brand); }
      #s7-bg { opacity: 0.35; }
      #s7-brand {
        position: absolute; top: 210px; left: 0; width: 1080px;
        display: flex; justify-content: center; align-items: center; gap: 16px;
        color: #fff; font-weight: 800; font-size: 44px;
      }
      #s7-brand img { width: 92px; height: 92px; border-radius: 50%; border: 4px solid #fff; }
      #s7-ball { position: absolute; left: 290px; top: 360px; width: 500px; }
      #s7-stars { position: absolute; top: 780px; left: 0; width: 1080px; text-align: center; color: #fff; font-weight: 800; font-size: 46px; }
      #s7-price { position: absolute; top: 850px; left: 0; width: 1080px; text-align: center; color: #fff; font-weight: 900; font-size: 210px; line-height: 1; letter-spacing: -4px; }
      #s7-price small { font-size: 70px; letter-spacing: 0; vertical-align: 0.9em; margin-right: 22px; }
      #s7-cta {
        position: absolute; top: 1110px; left: 120px; width: 840px; text-align: center;
        background: var(--dark); color: #fff; font-weight: 900; font-size: 56px;
        padding: 30px 20px; border-radius: 999px;
      }
      #s7-arrow { position: absolute; top: 1260px; left: 490px; width: 100px; height: 110px; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 20; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <!-- 1: Hook über Sprungbild (ab Frame 0) -->
      <div id="s1" class="scene clip" data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics">
        <img id="s1-img" class="full" src="assets/ki5.png" alt="" />
        <div id="s1-cap" class="cap"><span>12.500× verkauft.</span><br /><span id="s1-why" class="o">Warum? 🤔</span></div>
      </div>

      <!-- 2: rollt allein -->
      <div id="s2" class="scene clip" data-start="2.4" data-duration="1.8" data-track-index="1" data-track-kind="graphics">
        <img id="s2-img" class="full" src="assets/ki3.png" alt="" />
        <div id="s2-cap" class="cap"><span>1. Er rollt von allein</span></div>
      </div>

      <!-- 3: Vogel (echtes Foto) -->
      <div id="s3" class="scene clip" data-start="4.2" data-duration="1.6" data-track-index="1" data-track-kind="graphics">
        <img class="full" src="assets/szene-bg.jpg" alt="" />
        <div id="s3-card" class="card"><img src="assets/szene.jpg" alt="" /></div>
        <div id="s3-cap" class="cap top"><span>2. Vogel-Geräusche 🐦</span></div>
      </div>

      <!-- 4: Berührung (echtes Foto) -->
      <div id="s4" class="scene clip" data-start="5.8" data-duration="1.6" data-track-index="1" data-track-kind="graphics">
        <img class="full" src="assets/spiel-bg.jpg" alt="" />
        <div id="s4-card" class="card"><img src="assets/spiel.jpg" alt="" style="object-position:50% 40%" /></div>
        <div id="s4-cap" class="cap top"><span>3. Startet bei Berührung</span></div>
      </div>

      <!-- 5: nie mehr Langeweile -->
      <div id="s5" class="scene clip" data-start="7.4" data-duration="1.8" data-track-index="1" data-track-kind="graphics">
        <img id="s5-img" class="full" src="assets/ki1.png" alt="" />
        <div id="s5-cap" class="cap top"><span>Schluss mit Langeweile,</span><br /><span class="o">wenn du weg bist</span></div>
      </div>

      <!-- 6: abends müde -->
      <div id="s6" class="scene clip" data-start="9.2" data-duration="2" data-track-index="1" data-track-kind="graphics">
        <img id="s6-img" class="full" src="assets/ki4.png" alt="" />
        <div id="s6-cap" class="cap"><span>Abends: fix und fertig 😴</span></div>
      </div>

      <!-- 7: CTA -->
      <div id="s7" class="scene clip" data-start="11.2" data-duration="3.8" data-track-index="1" data-track-kind="graphics">
        <img id="s7-bg" class="full" src="assets/ki3-bg.jpg" alt="" />
        <div id="s7-brand"><img src="assets/beagle.png" alt="" />HundeWissenTv 2.0</div>
        <img id="s7-ball" src="assets/ball.png" alt="" />
        <div id="s7-stars">★ 4,1 · über 870 Bewertungen</div>
        <div id="s7-price"><small>nur</small>15,17 €</div>
        <div id="s7-cta">Unten im Warenkorb 🛒</div>
        <svg id="s7-arrow" viewBox="0 0 100 110"><path d="M50 8 L50 90 M18 60 L50 94 L82 60" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>

      <div id="flash" class="clip" data-start="0" data-duration="15" data-track-index="3"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at, d = 0.35) =>
        tl.fromTo(sel, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2)" }, at);
      const cap = (sel, at) =>
        tl.fromTo(sel, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, at);
      const flash = (at) =>
        tl.fromTo("#flash", { opacity: 0.7 }, { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, at);
      // Langsamer Zoom (Ken Burns), Richtung wechselt pro Bild
      const zoom = (sel, at, dur, inward = true) =>
        tl.fromTo(sel, { scale: inward ? 1.0 : 1.14 }, { scale: inward ? 1.14 : 1.0, duration: dur, ease: "none" }, at);
      const card = (sel, at, dur) => {
        tl.fromTo(sel, { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power3.out" }, at);
        tl.fromTo(sel + " img", { scale: 1 }, { scale: 1.1, duration: dur, ease: "none" }, at);
      };

      // 1: Text steht ab Frame 0, „Warum?“ wackelt
      zoom("#s1-img", 0, 2.4);
      tl.fromTo("#s1-why", { rotation: 0 }, { rotation: 3, duration: 0.08, yoyo: true, repeat: 5, ease: "none" }, 0.8);

      flash(2.4);
      zoom("#s2-img", 2.4, 1.8, false);
      cap("#s2-cap", 2.5);

      card("#s3-card", 4.2, 1.6);
      cap("#s3-cap", 4.3);

      card("#s4-card", 5.8, 1.6);
      cap("#s4-cap", 5.9);

      zoom("#s5-img", 7.4, 1.8);
      cap("#s5-cap", 7.5);

      zoom("#s6-img", 9.2, 2, false);
      cap("#s6-cap", 9.3);

      // 7: CTA
      flash(11.2);
      pop("#s7-brand", 11.25);
      tl.fromTo("#s7-ball", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 11.25);
      tl.to("#s7-ball", { rotation: 5, duration: 0.2, yoyo: true, repeat: 13, ease: "sine.inOut" }, 11.7);
      pop("#s7-stars", 11.5);
      tl.fromTo("#s7-price", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, 11.7);
      pop("#s7-cta", 12.1);
      tl.fromTo("#s7-arrow", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 }, 12.4);
      tl.to("#s7-arrow", { y: 26, duration: 0.3, yoyo: true, repeat: 7, ease: "sine.inOut" }, 12.65);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
