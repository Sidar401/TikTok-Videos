<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #ff8a1f33 0%, #ff8a1f0d 38%, transparent 62%), radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0c 2px, transparent 2px), linear-gradient(90deg, #ffffff0c 2px, transparent 2px); background-size: 90px 90px; }
      .scene { position: absolute; inset: 0; }
      .inner { position: absolute; inset: 0; }
      .t { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; line-height: 1.02; letter-spacing: -1px; color: #fff; }
      .glow-o { color: #ff8a1f; text-shadow: 0 0 50px #ff8a1faa; }
      .glow-g { color: #2fd27a; text-shadow: 0 0 50px #2fd27aaa; }
      .glow-r { color: #ff4d4d; text-shadow: 0 0 50px #ff4d4daa; }
      .box { display: inline-block; padding: 6px 34px 14px; border-radius: 24px; background: #ff8a1f; color: #111; box-shadow: 0 0 60px #ff8a1f88; }
      #logo { position: absolute; left: 445px; top: 135px; width: 190px; height: 190px; border-radius: 50%; overflow: hidden; border: 5px solid #DB8622; box-shadow: 0 0 30px #ff8a1f88; z-index: 5; }
      #logo img { width: 100%; height: 100%; object-fit: cover; }
      #brand { position: absolute; left: 0; top: 335px; width: 1080px; text-align: center; font-size: 38px; font-weight: 800; color: #ffffffdd; letter-spacing: 1px; z-index: 5; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 9; pointer-events: none; }
      .p { position: absolute; border-radius: 50%; }
      .l { display: inline-block; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
      .ew { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 6; font-weight: 900; font-size: 104px; line-height: 1; color: #fff; text-transform: uppercase;
        letter-spacing: -1px; text-shadow: 0 6px 0 #000, 0 0 30px #000; white-space: nowrap; }
      .cap { position: absolute; left: 60px; top: 1330px; width: 960px; text-align: center; z-index: 6; }
      .cap span { display: inline-block; margin: 0 16px; font-weight: 900; font-size: 74px; line-height: 1.15; color: #fff; text-shadow: 0 6px 0 #000, 0 0 30px #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.0" data-width="1080" data-height="1920">
      <div id="raster"></div>
      <div id="z0" class="scene clip" data-start="0.0" data-duration="3.0" data-track-index="1"><div id="z0-i" class="inner"><style>
#ls-bg { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 46%, #ff8a1f55 0%, #ff8a1f14 30%, transparent 60%), #0e1012; z-index:7; }
#ls-ring { position:absolute; left:375.0px; top:715.0px; width:330px; height:330px; border-radius:50%; border:6px solid #ff8a1f; z-index:8; }
#ls-logo { position:absolute; left:415.0px; top:755.0px; width:250px; height:250px; border-radius:50%; overflow:hidden;
  border:8px solid #DB8622; box-shadow:0 0 70px #ff8a1fbb, 0 20px 40px #000; z-index:9; }
#ls-logo img { width:100%; height:100%; object-fit:cover; }
#ls-txt { position:absolute; left:320px; top:817.6px; z-index:9; clip-path: inset(0 0 0 0); }
#ls-name { font-weight:900; font-size:80px; line-height:1; color:#fff; letter-spacing:-1px; white-space:nowrap; text-shadow:0 0 40px #0008; }
#ls-name b { color:#ff8a1f; text-shadow:0 0 40px #ff8a1faa; }
#ls-tag { margin-top:18px; font-weight:900; font-size:42px; color:#ff8a1f; letter-spacing:2px; white-space:nowrap; }
#ls-tag i { font-style:normal; color:#ffffffcc; padding:0 6px; }
</style>
<div id="ls-bg"></div><div id="ls-ring"></div>
<div id="ls-logo"><img src="assets/beagle.png" alt="" /></div>
<div id="ls-txt"><div id="ls-name">HundeFinanz<b>Tv</b></div><div id="ls-tag">GELD <i>|</i> BÖRSE <i>|</i> NEWS</div></div></div></div>
      <div id="logo"><img src="assets/beagle.png" alt="" /></div>
      <div id="brand">HundeFinanzTv</div>
      <div id="flash"></div>
      <div id="frame"></div>
      <div id="captions" data-track-kind="captions">

      </div>
      <audio id="voice" src="assets/mix.wav" data-start="0" data-duration="3.0" data-track-index="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, at) => tl.fromTo(sel, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, at);
      const slam = (sel, at) => tl.fromTo(sel, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.in" }, at);
      const shake = (sel, at) => tl.fromTo(sel, { x: -14 }, { x: 14, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, at);
      const draw = (sel, at, dur) => {
        const len = document.querySelector(sel).getTotalLength();
        tl.fromTo(sel, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      };
      const zaehl = (sel, von, bis, at, dur, nach) => {
        const o = { v: von };
        tl.fromTo(o, { v: von }, { v: bis, duration: dur, ease: "power2.out", onUpdate: () => {
          document.querySelector(sel).textContent = Math.round(o.v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (nach || ""); }, immediateRender: false }, at);
      };
      const flash = (at, st) => tl.fromTo("#flash", { opacity: st || 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at);
      const burst = (sel, at, dur) => tl.fromTo(sel + " .p", { x: 0, y: 0, scale: 1.4, opacity: 1 },
        { x: (i, el) => +el.dataset.dx, y: (i, el) => +el.dataset.dy, scale: 0.2, opacity: 0, duration: dur || 1.0, ease: "power3.out", immediateRender: false }, at);
      const letters = (sel, at) => tl.fromTo(sel + " .l", { y: 140, opacity: 0, rotation: 12, scale: 0.6 },
        { y: 0, opacity: 1, rotation: 0, scale: 1, duration: 0.45, stagger: 0.035, ease: "back.out(2.2)" }, at);
      const glitch = (sel, at) => tl.fromTo(sel, { x: -22, skewX: 18 }, { x: 0, skewX: 0, duration: 0.24, ease: "steps(6)" }, at);
      tl.set(["#logo", "#brand"], { opacity: 0 }, 0.0); tl.set(["#logo", "#brand"], { opacity: 1 }, 3.0);
      tl.fromTo("#ls-logo", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 0.0);
      flash(0.12, 0.35);
      tl.fromTo("#ls-ring", { scale: 0.6, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.7, ease: "power2.out" }, 0.15);
      tl.fromTo(["#ls-logo", "#ls-ring"], { x: 0 }, { x: -365.0, duration: 0.5, ease: "power3.inOut" }, 0.75);
      tl.fromTo("#ls-txt", { x: 260, opacity: 0, clipPath: "inset(0 0 0 100%)" }, { x: 0, opacity: 1, clipPath: "inset(0 0 0 0%)", duration: 0.55, ease: "power3.out" }, 0.9);
      tl.fromTo("#ls-tag", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.35);
      tl.fromTo("#ls-bg", { scale: 1 }, { scale: 1.08, duration: 3.0, ease: "none" }, 0.0);
      tl.to(["#ls-logo", "#ls-txt"], { scale: 1.02, duration: 1.2, ease: "none" }, 1.4);
      tl.to(["#ls-logo", "#ls-txt"], { opacity: 0, duration: 0.2 }, 2.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
