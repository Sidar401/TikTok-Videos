<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:200px;width:1080px;font-weight:900;font-size:110px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Einfach weg?</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">Wirecard-Skandal</span></div></div><svg viewBox="0 0 1080 1920" style="position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:2"><path d="M90 1120 L330 1080 L520 1110 L640 1500 L800 1680 L990 1720" fill="none" stroke="#ff4d4d" stroke-width="22" stroke-linejoin="round" style="filter:drop-shadow(0 0 24px #ff4d4d)"/></svg><div style="position:absolute;left:240px;top:650px;width:600px;padding:36px 50px;border-radius:34px;background:#fff;transform:rotate(-3deg);box-shadow:0 0 90px #3a7bd599, 0 40px 60px #000;z-index:3"><img src="assets/wirecard.svg" style="width:100%;display:block"/></div><div style="position:absolute;left:0;width:1080px;top:900px;text-align:center;font-weight:900;font-size:200px;line-height:1;white-space:nowrap;color:#ffc533;text-shadow:0 0 60px #ffc533aa, 0 10px 0 #000;z-index:4">1,9 Mrd.€</div><div style="position:absolute;left:560px;top:1180px;padding:10px 30px;border:10px solid #ff4d4d;border-radius:20px;color:#ff4d4d;font-weight:900;font-size:90px;letter-spacing:4px;transform:rotate(-10deg);background:#0e1012dd;box-shadow:0 0 40px #ff4d4d88;z-index:5">WEG!</div><div style="position:absolute;left:110px;top:1560px;padding:8px 30px 12px;border-radius:20px;background:#ff8a1f;color:#111;font-weight:900;font-size:72px;white-space:nowrap;box-shadow:0 0 40px #ff8a1f99;transform:rotate(-2deg);z-index:3">Wo ist Marsalek?</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
