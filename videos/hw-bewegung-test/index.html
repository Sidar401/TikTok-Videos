<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/magazin.css" />
    <style>
      #dogc { position: absolute; left: 140px; top: 640px; width: 800px; height: 784px; z-index: 5; transform-origin: 50% 100%; }
      #shadow { position: absolute; left: 300px; top: 1350px; width: 480px; height: 44px; border-radius: 50%; background: radial-gradient(#0000002e, transparent 70%); z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="s1" class="scene">
        <div id="s1k" class="kick" style="top: 440px">Körpersprache</div>
        <div id="s1h" class="h" style="top: 492px; font-size: 94px">Was sein <i>Schwanz</i> dir verrät.</div>
        <div class="src" style="top: 1418px">Studie: Universität Bari, Italien (2007)</div>
      </div>
      <div id="shadow"></div>
      <canvas id="dogc" width="1100" height="1078"></canvas>

      <div id="k1" class="cap">wedelt dein hund mit dem <b>schwanz</b>?</div>
      <div id="k2" class="cap">wedelt er eher nach <b>rechts</b>: freude</div>
      <div id="k3" class="cap">eher nach <b>links</b>: unsicherheit</div>
      <div id="k4" class="cap">das zeigte eine <b>studie aus italien</b></div>
      <div id="k5" class="cap">achte mal <b>darauf!</b></div>
      <div id="follow"><span>Folgen für mehr <b>Hundewissen</b></span></div>
      <div id="logo"><img src="assets/beagle.png" alt="" /></div>
      <div id="name">HundeWissenTv</div>
      <div id="rule"><i id="rule-in"></i></div>
      <div id="grain"></div>
      <img id="tex" src="assets/freudig2x.png" style="display: none" alt="" />
    </div>
    <script>
      const DUR = 15;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script src="assets/magazin.js"></script>
    <script>
      kopf();
      scenes([["#s1", 0]]);
      up("#s1k", 0.2); up("#s1h", 0.35, 0.6);
      caps([["#k1", 0, 3], ["#k2", 3, 6], ["#k3", 6, 9], ["#k4", 9, 12], ["#k5", 12, 13.4]]);
      folgen(13.4);
      tl.to({}, { duration: 0.01 }, DUR - 0.01);

      // ---------- Bild-Verformung (WebGL): einzelne Körperteile bewegen ----------
      const cv = document.getElementById("dogc");
      const gl = cv.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });
      const VS = "attribute vec2 a; varying vec2 v; void main(){ v = vec2(a.x*0.5+0.5, 0.5-a.y*0.5); gl_Position = vec4(a,0.,1.); }";
      const FS = `precision highp float;
        uniform sampler2D tex; uniform vec2 size;
        uniform float aTail, aHead, aJaw, aEarL, aEarR, aBreath, aLegL, aLegR;
        varying vec2 v;
        vec2 rot(vec2 p, vec2 c, float a){ float s=sin(a), k=cos(a); p-=c; return c+vec2(k*p.x-s*p.y, s*p.x+k*p.y); }
        float blob(vec2 p, vec2 c, vec2 r){ vec2 d=(p-c)/r; return exp(-dot(d,d)); }
        void main(){
          vec2 p = v*size/2.0 - 60.0; vec2 q = p;
          float wt = (1.0-smoothstep(95.0,178.0,p.x))*(1.0-smoothstep(275.0,305.0,p.y));
          q = rot(q, vec2(150.0,215.0), -aTail*wt);
          float wl = smoothstep(280.0,320.0,p.y)*(1.0-smoothstep(262.0,292.0,p.x))*smoothstep(135.0,160.0,p.x);
          q = rot(q, vec2(215.0,295.0), -aLegL*wl);
          float wr = smoothstep(280.0,320.0,p.y)*smoothstep(322.0,345.0,p.x);
          q = rot(q, vec2(355.0,295.0), -aLegR*wr);
          float wb = blob(p, vec2(285.0,255.0), vec2(115.0,70.0));
          q.x = mix(q.x, 285.0+(q.x-285.0)/(1.0+aBreath), wb);
          float wh = (1.0-smoothstep(150.0,215.0,p.y))*smoothstep(150.0,195.0,p.x);
          q = rot(q, vec2(285.0,215.0), -aHead*wh);
          q = rot(q, vec2(205.0,50.0), -aEarL*blob(p, vec2(185.0,85.0), vec2(38.0,48.0)));
          q = rot(q, vec2(365.0,50.0), -aEarR*blob(p, vec2(392.0,100.0), vec2(36.0,58.0)));
          float wj = smoothstep(120.0,138.0,p.y)*blob(p, vec2(285.0,162.0), vec2(62.0,44.0));
          q.y -= aJaw*wj;
          gl_FragColor = texture2D(tex, (q+60.0)*2.0/size);
        }`;
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
      const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const U = (n) => gl.getUniformLocation(prog, n);
      const im = document.getElementById("tex");
      const S = (a, b, x) => { const k = Math.max(0, Math.min(1, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
      const TAU = Math.PI * 2;
      let ok = false;
      function render(t) {
        if (!ok) return;
        const wagFast = S(2.7, 3.3, t), legs = S(8.7, 9.3, t) * (1 - S(13.2, 13.6, t)), tilt = S(6.0, 6.5, t) * (1 - S(8.6, 9.1, t));
        const tail = (0.15 + 0.12 * wagFast) * Math.sin(t * TAU * (2.0 + 1.6 * wagFast));
        const pant = S(2.8, 3.4, t);
        gl.uniform1f(U("aTail"), tail);
        gl.uniform1f(U("aJaw"), pant * (4 + 4 * Math.sin(t * TAU * 3)));
        gl.uniform1f(U("aBreath"), 0.012 * Math.sin(t * TAU * 1.1) + pant * 0.014 * Math.sin(t * TAU * 3));
        gl.uniform1f(U("aHead"), 0.035 * Math.sin(t * TAU * 0.45) + tilt * 0.13);
        gl.uniform1f(U("aEarL"), 0.09 * Math.sin(t * TAU * 2.2 + 1) - tilt * 0.06);
        gl.uniform1f(U("aEarR"), -0.09 * Math.sin(t * TAU * 2.2 + 1.7) + tilt * 0.05);
        gl.uniform1f(U("aLegL"), legs * 0.16 * Math.sin(t * TAU * 2.4));
        gl.uniform1f(U("aLegR"), legs * 0.16 * Math.sin(t * TAU * 2.4 + Math.PI));
        gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        const bob = legs * Math.abs(Math.sin(t * TAU * 1.2)) * 18 + (1 - legs) * 0;
        const enter = 1 - S(0.4, 1.1, t);
        cv.style.transform = `translateY(${(-bob + enter * 900).toFixed(1)}px)`;
        document.getElementById("shadow").style.transform = `scaleX(${(1 - bob / 60).toFixed(3)})`;
      }
      const ready = new Promise((res) => { const go = () => {
        const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.uniform2f(U("size"), 1100, 1078); gl.uniform1i(U("tex"), 0); ok = true; render(lastT); res(); };
        im.complete ? go() : (im.onload = go); });
      let lastT = 0;
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.dog = ready;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; render(lastT); });
    </script>
  </body>
</html>
