<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1012; }
      #root { position: relative; width: 100%; height: 100%; font-family: Montserrat, sans-serif; overflow: hidden;
        background: radial-gradient(ellipse at 50% 55%, #ff8a1f40 0%, #ff8a1f10 35%, transparent 60%),
                    radial-gradient(ellipse at 50% 50%, #1b1f22 0%, #0e1012 75%); }
      #raster { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 2px, transparent 2px), linear-gradient(90deg, #ffffff0d 2px, transparent 2px);
        background-size: 96px 96px; }
      .scene { position: absolute; inset: 0; }
      #frame { position: absolute; inset: 0; border: 26px solid #DB8622; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <div id="raster"></div>
<div id="v0" class="scene clip" data-start="0" data-duration="1" data-track-index="1"><div style="position:absolute;left:0px;top:210px;width:1080px;font-weight:900;font-size:100px;line-height:1.02;letter-spacing:-2px;text-align:center;display:flex;flex-direction:column;gap:14px;z-index:3"><div style="color:#fff;text-shadow:0 6px 0 #000">Autoversicherung</div><div><span style="display:inline-block;padding:4px 30px 10px;border-radius:22px;background:#ff8a1f;color:#111;box-shadow:0 0 60px #ff8a1f88">bis 30.11.</span></div><div style="color:#fff;text-shadow:0 6px 0 #000">wechseln!</div></div><div style="position:absolute;left:290px;top:820px;width:500px;height:500px;border-radius:50px;background:#16191b;border:8px solid #ff8a1f;box-shadow:0 0 90px #ff8a1f77, 0 40px 60px #000;transform:rotate(-5deg);overflow:hidden;z-index:2"><div style="height:130px;background:#ff8a1f;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:76px;color:#111">NOVEMBER</div><div style="text-align:center;font-weight:900;font-size:290px;line-height:360px;color:#fff;text-shadow:0 0 40px #ff8a1faa">30</div></div><div style="position:absolute;left:140px;top:1420px;padding:8px 30px 12px;border-radius:20px;background:#ff4d4d;color:#fff;font-weight:900;font-size:80px;white-space:nowrap;box-shadow:0 0 40px #ff4d4d99;transform:rotate(-4deg);z-index:3"><s>780 €</s></div><div style="position:absolute;left:600px;top:1420px;padding:8px 30px 12px;border-radius:20px;background:#2fd27a;color:#111;font-weight:900;font-size:80px;white-space:nowrap;box-shadow:0 0 40px #2fd27a99;transform:rotate(4deg);z-index:3">520 €</div><div style="position:absolute;left:0;top:1600px;width:1080px;text-align:center;font-weight:900;font-size:80px;color:#2fd27a;text-shadow:0 0 40px #2fd27a88">+260 € pro Jahr</div></div>
      <div id="frame"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
